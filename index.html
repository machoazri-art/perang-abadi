<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perang Abadi">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>⚔️ Perang Abadi — Text RPG</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:14px max(14px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom));min-height:100vh;background:radial-gradient(circle at 50% 0%,#1a1f2e 0%,#0a0c11 70%);color:#d8dce6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:680px}h1{font-size:22px;text-align:center;letter-spacing:2px;margin:8px 0 18px;color:#ffb347;text-shadow:0 0 14px #ff8c0073}
.panel{background:#161a24eb;border:1px solid #2c3446;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 4px 20px #0008}
.panel h2{font-size:13px;margin:0 0 10px;color:#9aa8c7;letter-spacing:1.3px;text-transform:uppercase;border-bottom:1px solid #2c3446;padding-bottom:7px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:6px 0}.row span:last-child{color:#fff;font-weight:bold;text-align:right}
.bar{height:9px;background:#1b2130;border-radius:6px;overflow:hidden;margin:4px 0 8px;border:1px solid #2c3446}.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.hp i{background:linear-gradient(90deg,#e5443b,#ff7a5c)}.xp i{background:linear-gradient(90deg,#3a7bd5,#4fd1c5)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:7px}
button{font:inherit;font-size:13px;min-height:44px;padding:11px 8px;cursor:pointer;background:#232b3d;color:#cfe0ff;border:1px solid #3b4761;border-radius:9px;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.985)}button:disabled{opacity:.35;cursor:not-allowed}button.primary{background:#7a2a1f;border-color:#c0392b;color:#ffd9c9;grid-column:1/-1}button.gold{background:#3d3418;border-color:#8a7530;color:#ffe08a}
input{width:100%;padding:12px;font:inherit;font-size:16px;background:#161b26;border:1px solid #3b4761;border-radius:8px;color:white;margin:5px 0 10px}
#log{background:#0c0f16;border:1px solid #242c3c;border-radius:8px;padding:10px;height:170px;overflow:auto;font-size:12.5px;line-height:1.65;margin-bottom:12px;overflow-wrap:anywhere}
.notice,.petcard,.enemycard{padding:11px;border-radius:9px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.notice{background:#ffb4461a;border:1px solid #8a6a25;color:#ffd98a;white-space:pre-line}
.petcard{background:#5a3c8a24;border:1px solid #4a3a6d}.enemycard{background:#8c282826;border:1px solid #6d2a2a}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:#2b3550;color:#9db4e0}.empty,.small{color:#8791a6;font-size:12px}.empty{text-align:center;padding:10px;font-style:italic}.center{text-align:center}
.footer{color:#69758b;text-align:center;font-size:10px;padding:4px}
@media(min-width:520px){body{padding-top:22px}.panel{padding:16px}}
</style>
</head>
<body>
<div id="app"><h1>⚔️ PERANG ABADI ⚔️</h1><div id="screen"></div><div class="footer">PERANG ABADI · PWA EDITION</div></div>
<script>
const SAVE_KEY='perangAbadi_save_v1';
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PET_TYPES={
 wolf:{label:'🐺 Serigala',cost:80,baseAtk:10,baseHp:45,passive:'+3 Seranganmu'},
 bear:{label:'🐻 Beruang',cost:150,baseAtk:8,baseHp:75,passive:'-2 Damage diterima'},
 eagle:{label:'🦅 Elang',cost:220,baseAtk:13,baseHp:40,passive:'20% Peluang Kritikal'},
 dragon:{label:'🐉 Naga',cost:500,baseAtk:18,baseHp:95,passive:'+6 Seranganmu'}
};
const PET_NAMES=['Bayangan','Badai','Bara','Kilat','Taring','Guntur','Rembulan','Abu','Salju','Nyala','Belati','Kabut'];
const ENEMIES={
1:[{n:'Bandit Jalanan',hp:45,atk:11,def:2,xp:35,gold:18},{n:'Serigala Liar',hp:40,atk:13,def:1,xp:32,gold:15},{n:'Goblin Perampok',hp:52,atk:10,def:3,xp:38,gold:22}],
2:[{n:'Orc Buas',hp:80,atk:17,def:5,xp:60,gold:35},{n:'Prajurit Bayaran',hp:90,atk:15,def:7,xp:65,gold:40},{n:'Troll Kecil',hp:100,atk:19,def:4,xp:70,gold:38}],
3:[{n:'Ksatria Gelap',hp:130,atk:24,def:9,xp:100,gold:60},{n:'Wyvern',hp:120,atk:28,def:7,xp:105,gold:65},{n:'Necromancer',hp:110,atk:30,def:6,xp:110,gold:70}],
4:[{n:'Raksasa Perang',hp:190,atk:35,def:12,xp:160,gold:95},{n:'Panglima Iblis',hp:170,atk:40,def:10,xp:170,gold:100},{n:'Naga Hitam',hp:210,atk:38,def:14,xp:180,gold:110}],
5:[{n:'Raja Iblis',hp:400,atk:55,def:18,xp:400,gold:300}]};
const CHAPTER_NAME={1:'Hutan Perbatasan',2:'Dataran Orc',3:'Reruntuhan Kuno',4:'Gerbang Neraka',5:'Singgasana Iblis'};
const GEAR={weapons:[{id:'iron',name:'Pedang Besi',atk:5,cost:90},{id:'knight',name:'Pedang Ksatria',atk:12,cost:260},{id:'dragon',name:'Pedang Naga',atk:22,cost:650}],armors:[{id:'leather',name:'Perisai Kulit',def:3,cost:90},{id:'steel',name:'Perisai Baja',def:8,cost:280},{id:'abyss',name:'Zirah Neraka',def:15,cost:700}]};
const SKILLS={power:{name:'Tebasan Perkasa',level:2,desc:'Serangan 2.2x damage',mult:2.2},flame:{name:'Amukan Naga',level:5,desc:'Serangan 3.2x damage',mult:3.2},guard:{name:'Benteng Jiwa',level:3,desc:'Kurangkan damage musuh 70% untuk satu giliran',guard:true}};
let S=null,busy=false;const screen=document.getElementById('screen');
function save(){if(S)try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){notice('Storage penuh atau tidak tersedia. Export save disarankan.')}}
function normalizeSave(d){d.gear=d.gear||{weapon:null,armor:null};d.skills=Array.isArray(d.skills)?d.skills:[];d.skillPoints=Number.isFinite(d.skillPoints)?d.skillPoints:0;d.usedSkills=Array.isArray(d.usedSkills)?d.usedSkills:[];d.dungeonFloor=Number.isFinite(d.dungeonFloor)?d.dungeonFloor:0;d.inBattle=false;d.enemy=null;d.defending=false;return d}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d)return null;return normalizeSave(d)}catch(e){return null}}
function hasSave(){return !!localStorage.getItem(SAVE_KEY)}
function newState(name){return{name:name||'Prajurit',level:1,xp:0,xpNext:100,hp:100,maxHp:100,atk:10,def:5,gold:60,potions:3,wins:0,chapter:1,pets:[],activeIdx:-1,inBattle:false,enemy:null,defending:false,log:[],notice:'',gear:{weapon:null,armor:null},skills:[],skillPoints:0,usedSkills:[],dungeonFloor:0}}
const getPet=()=>S&&S.activeIdx>=0&&S.pets[S.activeIdx]?S.pets[S.activeIdx]:null;
function pushLog(t){S.log.push(t);if(S.log.length>60)S.log.shift()}
function notice(t){S.notice=S.notice?S.notice+'\n'+t:t}
function gainXp(x){S.xp+=x;while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=Math.round(S.xpNext*1.35);S.skillPoints=(S.skillPoints||0)+1;S.maxHp+=25;S.hp=S.maxHp;S.atk+=4;S.def+=2;notice(`⭐ NAIK LEVEL ${S.level}! Serangan +4 · Pertahanan +2 · HP Max +25`)}}
function petGainXp(p,x){p.xp+=x;while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(p.xpNext*1.4);p.maxHp+=12;p.hp=p.maxHp;p.atk+=3;notice(`🐾 ${p.name} naik ke Level ${p.level}!`)}}
function spawnEnemy(){const ch=Math.min(5,S.chapter),pool=ENEMIES[ch],b=ch===5?pool[0]:pool[rand(0,pool.length-1)],boss=(S.wins+1)%4===0,e={name:(boss?'👑 ':'')+b.n+(boss?' [BOS]':''),maxHp:Math.round(b.hp*(boss?2.2:1)),atk:Math.round(b.atk*(boss?1.4:1)),def:Math.round(b.def*(boss?1.3:1)),xp:Math.round(b.xp*(boss?3:1)),gold:Math.round(b.gold*(boss?3.5:1)),boss};e.hp=e.maxHp;return e}
function bar(cls,cur,max){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,cur/max*100))}%"></i></div>`}
function render(){if(!S)renderStart();else if(S.inBattle)renderBattle();else renderHub()}
function renderStart(){const ada=hasSave();screen.innerHTML=`<div class="panel center"><p style="font-size:13px;line-height:1.7;color:#9aa8c7">Dunia terbakar. Kerajaan terakhir berdiri di ambang kehancuran.<br>Kau adalah satu-satunya harapan — bersama sahabat berbulu atau bersisik.<br><br><span class="small">Bertarunglah, naiklah level, pelihara hewan peliharaanmu.</span></p></div><div class="panel"><h2>Mulai Petualangan</h2><input id="nameInput" maxlength="14" placeholder="Nama prajuritmu..." value="Prajurit"><div class="btns"><button class="primary" onclick="startNew()">🗡️ Mulai Perang Baru</button>${ada?'<button onclick="continueGame()" style="grid-column:1/-1">💾 Lanjutkan Perjalanan</button>':''}</div></div>`}
function startNew(){const v=document.getElementById('nameInput');S=newState(v&&v.value.trim()?v.value.trim().slice(0,14):'Prajurit');notice(`Selamat datang, ${S.name}. Perjalananmu dimulai di ${CHAPTER_NAME[1]}.`);save();render()}
function continueGame(){const d=loadSave();if(d){S=d;render()}}
function renderHub(){const p=getPet(),xpPct=Math.round(S.xp/S.xpNext*100);screen.innerHTML=`${S.notice?`<div class="notice">${S.notice.replace(/\n/g,'<br>')}</div>`:''}<div class="panel"><h2>${S.name} · Level ${S.level}</h2><div class="row"><span>❤️ HP</span><span>${S.hp}/${S.maxHp}</span></div>${bar('hp',S.hp,S.maxHp)}<div class="row"><span>✨ XP</span><span>${S.xp}/${S.xpNext} (${xpPct}%)</span></div>${bar('xp',S.xp,S.xpNext)}<div class="row"><span>⚔️ Serangan</span><span>${S.atk}</span></div><div class="row"><span>🛡️ Pertahanan</span><span>${S.def}</span></div><div class="row"><span>🧪 Ramuan</span><span>${S.potions}</span></div><div class="row"><span>💰 Emas</span><span>${S.gold}</span></div><div class="row"><span>🏆 Kemenangan</span><span>${S.wins}</span></div><div class="row"><span>🗺️ Wilayah</span><span>Bab ${S.chapter} — ${CHAPTER_NAME[S.chapter]}</span></div></div><div class="panel"><h2>Hewan Peliharaan</h2>${p?`<div class="petcard"><div class="row"><span>${PET_TYPES[p.type].label} <b>${p.name}</b></span><span>Lv ${p.level}</span></div>${bar('hp',p.hp,p.maxHp)}<div class="row"><span>❤️ ${p.hp}/${p.maxHp}</span><span>⚔️ ${p.atk}</span></div><div class="row"><span>✨ ${p.xp}/${p.xpNext}</span><span class="small">${PET_TYPES[p.type].passive}</span></div>${p.hp<=0?'<div class="small">😵 Pingsan — istirahat untuk memulihkan</div>':''}</div>`:'<div class="empty">Belum ada sahabat setia. Adopsi di Toko 🛒</div>'}</div><div class="panel"><h2>Aksi</h2><div class="btns"><button class="primary" onclick="cariMusuh()">⚔️ Cari Musuh</button><button class="gold" onclick="istirahat()">🏕️ Istirahat (20 💰)</button><button onclick="bukaToko()">🛒 Toko</button><button onclick="bukaKandang()">🐾 Kandang</button><button onclick="bukaEquipment()">⚔️ Equipment</button><button onclick="bukaSkillTree()">✨ Skill Tree (${S.skillPoints||0} SP)</button><button onclick="masukDungeon()">🏰 Dungeon</button>${S.dungeonFloor>0?'<button class="gold" onclick="terusDungeon()">➡️ Sambung Dungeon (Floor '+S.dungeonFloor+')</button><button onclick="keluarDungeon()">🚪 Keluar Dungeon</button>':''}<button onclick="simpanManual()">💾 Simpan</button><button onclick="exportSave()">📤 Export Save</button><button onclick="importSave()">📥 Import Save</button><button onclick="hapusSave()">🗑️ Hapus Save</button></div></div>`}
function renderBattle(){const p=getPet(),e=S.enemy,logs=S.log.slice(-25).map(x=>`<div>${x}</div>`).join('');screen.innerHTML=`<div class="enemycard"><div class="row"><span style="font-size:14px;color:#ff8a70"><b>${e.name}</b></span><span>Lv ~${S.chapter}</span></div>${bar('hp',e.hp,e.maxHp)}<div class="row"><span>❤️ ${Math.max(0,e.hp)}/${e.maxHp}</span><span>⚔️ ${e.atk} · 🛡️ ${e.def}</span></div></div><div class="panel"><h2>Statusmu</h2>${bar('hp',S.hp,S.maxHp)}<div class="row"><span>❤️ ${S.hp}/${S.maxHp}</span><span>⚔️ ${S.atk} · 🛡️ ${S.def}</span></div>${p?`<div class="row"><span>${PET_TYPES[p.type].label} ${p.name}</span><span>❤️ ${p.hp}/${p.maxHp} · ⚔️ ${p.atk}</span></div>${bar('hp',p.hp,p.maxHp)}`:''}</div><div id="log">${logs}</div><div class="panel"><h2>Giliranmu</h2><div class="btns"><button onclick="doTurn('attack')" ${busy?'disabled':''}>⚔️ Serang</button><button onclick="doTurn('skill')" ${busy||!S.skills.some(k=>['power','flame'].includes(k)&&!S.usedSkills.includes(k))?'disabled':''}>✨ Skill</button><button onclick="doTurn('defend')" ${busy?'disabled':''}>🛡️ Bertahan</button><button onclick="doTurn('potion')" ${busy?'disabled':''}>🧪 Ramuan (${S.potions})</button><button onclick="doTurn('flee')" ${busy?'disabled':''}>🏃 Kabur</button></div></div>`;const l=document.getElementById('log');if(l)l.scrollTop=l.scrollHeight}
function cariMusuh(){if(S.hp<=0)S.hp=Math.round(S.maxHp*.3);S.enemy=spawnEnemy();S.inBattle=true;S.defending=false;S.usedSkills=[];S.notice='';S.log=[];pushLog(`⚠️ ${S.enemy.name} menghadangmu di ${CHAPTER_NAME[S.chapter]}!`);save();render()}
function istirahat(){if(S.gold<20){S.notice='💰 Emas tidak cukup untuk istirahat (butuh 20).';render();return}S.gold-=20;S.hp=S.maxHp;const p=getPet();if(p)p.hp=p.maxHp;S.notice='🏕️ Kamu beristirahat. HP dan hewan peliharaanmu pulih sepenuhnya.';save();render()}
function simpanManual(){save();S.notice='💾 Permainan tersimpan.';render()}
function hapusSave(){if(!confirm('Hapus semua data permainan? Tindakan ini tidak boleh dibatalkan.'))return;localStorage.removeItem(SAVE_KEY);S=null;renderStart()}
function bukaToko(){let out='';for(const k in PET_TYPES){const t=PET_TYPES[k],owned=S.pets.some(p=>p.type===k);out+=`<button ${owned||S.gold<t.cost?'disabled':''} onclick="beliPet('${k}')">${t.label}<br><span class="small">${t.cost} 💰 · ${t.passive}</span>${owned?'<br><span class="small">✔ dimiliki</span>':''}</button>`}screen.innerHTML=`<div class="panel"><h2>🛒 Toko Perang</h2><div class="row"><span>💰 Emasmu</span><span>${S.gold}</span></div></div><div class="panel"><h2>Ramuan</h2><button class="gold" ${S.gold<25?'disabled':''} onclick="beliPotion()">🧪 Beli Ramuan (25 💰)<br><span class="small">Pulihkan 50+ HP saat bertarung</span></button></div><div class="panel"><h2>Adopsi Hewan</h2><div class="btns">${out}</div><p class="small">Maksimal 4 hewan. Satu hewan aktif bertarung bersamamu.</p></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function beliPotion(){if(S.gold<25)return;S.gold-=25;S.potions++;save();bukaToko()}
function beliPet(k){const t=PET_TYPES[k];if(S.gold<t.cost||S.pets.some(p=>p.type===k))return;if(S.pets.length>=4){alert('Kandang penuh (maks 4).');return}S.gold-=t.cost;const p={type:k,name:PET_NAMES[rand(0,PET_NAMES.length-1)],level:1,xp:0,xpNext:60,atk:t.baseAtk,hp:t.baseHp,maxHp:t.baseHp};S.pets.push(p);if(S.activeIdx<0)S.activeIdx=S.pets.length-1;save();bukaToko()}
function bukaKandang(){let html=S.pets.length?S.pets.map((p,i)=>`<div class="petcard" style="margin-bottom:10px"><div class="row"><span>${PET_TYPES[p.type].label} <b>${p.name}</b> ${i===S.activeIdx?'<span class="tag">AKTIF</span>':''}</span><span>Lv ${p.level}</span></div>${bar('hp',p.hp,p.maxHp)}<div class="row"><span>❤️ ${p.hp}/${p.maxHp}</span><span>⚔️ ${p.atk}</span></div><div class="row"><span>✨ ${p.xp}/${p.xpNext}</span><span class="small">${PET_TYPES[p.type].passive}</span></div><div class="btns"><button ${i===S.activeIdx?'disabled':''} onclick="setAktif(${i})">⭐ Jadikan Aktif</button><button onclick="lepasPet(${i})">🕊️ Lepaskan</button></div></div>`).join(''):'<div class="empty">Kandang kosong. Adopsi hewan di Toko 🛒</div>';screen.innerHTML=`<div class="panel"><h2>🐾 Kandang</h2>${html}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function setAktif(i){S.activeIdx=i;save();bukaKandang()}
function lepasPet(i){if(!confirm(`Lepaskan ${S.pets[i].name} selamanya?`))return;S.pets.splice(i,1);if(S.activeIdx>=S.pets.length)S.activeIdx=S.pets.length-1;save();bukaKandang()}
function kembali(){save();render()}
function playerAtkValue(){const p=getPet();return S.atk+(S.gear&&S.gear.weapon?S.gear.weapon.atk:0)+(p&&p.hp>0?(p.type==='wolf'?3:p.type==='dragon'?6:0):0)}
async function doTurn(action){if(!S||!S.inBattle||busy)return;busy=true;render();const p=getPet(),e=S.enemy;
if(action==='attack'){let crit=!!(p&&p.hp>0&&p.type==='eagle'&&Math.random()<.2),d=Math.max(1,Math.round(playerAtkValue()-e.def/2+rand(-2,3)));if(crit)d=Math.round(d*2);e.hp-=d;pushLog(`⚔️ Kamu menebas ${e.name} — <b>${d}</b> dmg${crit?' 💢 KRITIS!':''}`)}
else if(action==='skill'){const key=S.skills.includes('flame')&&!S.usedSkills.includes('flame')?'flame':S.skills.includes('power')&&!S.usedSkills.includes('power')?'power':null;if(!key){pushLog('❌ Tiada skill serangan tersedia.');busy=false;render();return}const sk=SKILLS[key],d=Math.max(1,Math.round(playerAtkValue()*sk.mult-e.def/2+rand(-2,3)));e.hp-=d;S.usedSkills.push(key);pushLog(`✨ ${sk.name}! ${e.name} menerima <b>${d}</b> damage.`)}
else if(action==='defend'){S.defending=true;const h=Math.round(S.maxHp*.08);S.hp=Math.min(S.maxHp,S.hp+h);pushLog(`🛡️ Kamu bertahan & memulihkan <b>${h}</b> HP.`)}
else if(action==='potion'){if(S.potions<=0){pushLog('❌ Ramuan habis!');busy=false;render();return}S.potions--;const h=50+S.level*5;S.hp=Math.min(S.maxHp,S.hp+h);pushLog(`🧪 Kau menenggak ramuan — <b>+${h}</b> HP.`)}
else if(action==='flee'){if(Math.random()<.6){pushLog('🏃 Kau berhasil melarikan diri!');S.inBattle=false;S.enemy=null;S.defending=false;S.notice='🏃 Kau mundur dari pertempuran. Luka masih menganga...';busy=false;save();render();return}else pushLog('😰 Kau gagal kabur!')}
if(e.hp<=0){await sleep(250);busy=false;winBattle();return}await sleep(300);render();
if(p&&p.hp>0&&S.inBattle){let d=Math.max(1,Math.round(p.atk-e.def/3+rand(-2,2)));e.hp-=d;pushLog(`🐾 ${p.name} menerkam — <b>${d}</b> dmg.`);if(e.hp<=0){await sleep(250);busy=false;winBattle();return}await sleep(300);render()}
if(!S.inBattle){busy=false;return}let d=Math.max(1,Math.round(e.atk-(S.def+(S.gear&&S.gear.armor?S.gear.armor.def:0))/2+rand(-2,3)));if(S.defending)d=Math.max(1,Math.round(d*(S.skills.includes('guard')?.15:.35)));if(p&&p.hp>0&&p.type==='bear')d=Math.max(1,d-2);S.defending=false;S.hp-=d;pushLog(`💥 ${e.name} menyerangmu — <b>${d}</b> dmg.`);
if(p&&p.hp>0&&Math.random()<.3){let pd=Math.max(1,Math.round(e.atk*.5-2+rand(-2,2)));p.hp-=pd;pushLog(`💢 ${p.name} terkena <b>${pd}</b> dmg.`);if(p.hp<=0){p.hp=0;pushLog(`😵 ${p.name} pingsan!`)}}
if(S.hp<=0){S.hp=0;await sleep(300);busy=false;gameOver();return}busy=false;save();render()}
function winBattle(){const e=S.enemy;S.wins++;S.gold+=e.gold;gainXp(e.xp);const p=getPet();if(p){petGainXp(p,Math.round(e.xp*.6));p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*.5))}const old=S.chapter;S.chapter=Math.min(5,Math.floor(S.wins/4)+1);let msg=`🏆 Menang melawan ${e.name}! +${e.xp} XP · +${e.gold} 💰`;if(S.chapter>old){msg+=`\n🗺️ Kau memasuki wilayah baru: Bab ${S.chapter} — ${CHAPTER_NAME[S.chapter]}`;S.hp=Math.min(S.maxHp,S.hp+Math.round(S.maxHp*.4));if(p)p.hp=p.maxHp;msg+='\n💚 HP pulih sebagian kerana memasuki wilayah baru.'}notice(msg);S.inBattle=false;S.enemy=null;S.defending=false;busy=false;save();render()}
function gameOver(){S.dungeonFloor=0;const lost=Math.round(S.gold*.2);S.gold-=lost;S.hp=Math.round(S.maxHp*.5);const p=getPet();if(p)p.hp=Math.max(1,Math.round(p.maxHp*.4));S.inBattle=false;S.enemy=null;S.defending=false;busy=false;notice(`💀 Kau tumbang dalam pertempuran! Kehilangan ${lost} 💰. Bangkit dan balas dendam!`);save();render()}
function bukaEquipment(){const weapon=S.gear.weapon,armor=S.gear.armor;const items=[...GEAR.weapons.map(x=>({...x,type:'weapon'})),...GEAR.armors.map(x=>({...x,type:'armor'}))];screen.innerHTML=`<div class="panel"><h2>⚔️ Equipment Dipakai</h2><div class="row"><span>Senjata</span><span>${weapon?weapon.name+' (+'+weapon.atk+' ATK)':'Tiada'}</span></div><div class="row"><span>Armor</span><span>${armor?armor.name+' (+'+armor.def+' DEF)':'Tiada'}</span></div><div class="row"><span>Jumlah Attack</span><span>${playerAtkValue()}</span></div><div class="row"><span>Jumlah Defense</span><span>${S.def+(armor?armor.def:0)}</span></div></div><div class="panel"><h2>Kedai Equipment</h2><div class="btns">${items.map(x=>{const equipped=x.type==='weapon'?weapon:armor;const stat=x.type==='weapon?'+'+x.atk+' ATK':'+'+x.def+' DEF';return `<button ${equipped&&equipped.id===x.id?'disabled':''} ${S.gold<x.cost?'disabled':''} onclick="beliEquipment('${x.type}','${x.id}')">${x.name}<br><span class="small">${stat} · ${x.cost} 💰</span></button>`}).join('')}</div></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function beliEquipment(type,id){const item=(type==='weapon'?GEAR.weapons:GEAR.armors).find(x=>x.id===id);if(!item||S.gold<item.cost)return;S.gold-=item.cost;S.gear[type]={...item};save();bukaEquipment()}
function bukaSkillTree(){screen.innerHTML=`<div class="panel"><h2>✨ Skill Tree</h2><div class="row"><span>Skill Points</span><span>${S.skillPoints||0} SP</span></div><p class="small">Setiap naik level memberikan 1 Skill Point. Skill serangan boleh digunakan sekali setiap pertempuran.</p>${Object.entries(SKILLS).map(([id,sk])=>{const learned=S.skills.includes(id),eligible=S.level>=sk.level;return `<div class="petcard"><b>${sk.name}</b><div class="small">Perlu Level ${sk.level} · ${sk.desc}</div><button style="width:100%;margin-top:8px" ${learned||!eligible||(S.skillPoints||0)<1?'disabled':''} onclick="learnSkill('${id}')">${learned?'✔ Dipelajari':!eligible?'🔒 Belum cukup level':'Pelajari (1 SP)'}</button></div>`}).join('')}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function learnSkill(id){const sk=SKILLS[id];if(!sk||S.skills.includes(id)||S.level<sk.level||S.skillPoints<1)return;S.skillPoints--;S.skills.push(id);save();bukaSkillTree()}
function masukDungeon(){if(S.hp<=0)S.hp=Math.round(S.maxHp*.3);if(S.dungeonFloor>0){terusDungeon();return}S.dungeonFloor=1;startDungeonFloor()}
function terusDungeon(){if(S.dungeonFloor<1)S.dungeonFloor=1;else S.dungeonFloor++;if(S.dungeonFloor>5){S.dungeonFloor=0;S.notice='🏆 Dungeon berjaya ditamatkan!';save();render();return}startDungeonFloor()}
function startDungeonFloor(){const base=spawnEnemy(),f=S.dungeonFloor;S.enemy={...base,name:`🏰 Dungeon F${f} — ${base.name}`,maxHp:Math.round(base.maxHp*(1+f*.35)),atk:Math.round(base.atk*(1+f*.16)),def:Math.round(base.def*(1+f*.12)),xp:Math.round(base.xp*(1+f*.5)),gold:Math.round(base.gold*(1+f*.6))};S.enemy.hp=S.enemy.maxHp;S.inBattle=true;S.defending=false;S.usedSkills=[];S.notice='';S.log=[];pushLog(`🏰 Kau memasuki Dungeon, Floor ${f}. Musuh semakin kuat!`);save();render()}
function keluarDungeon(){S.dungeonFloor=0;S.notice='🚪 Kau meninggalkan dungeon.';save();render()}
function exportSave(){if(!S)return;const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='perang-abadi-save.json';a.click();URL.revokeObjectURL(url)}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.name||!Number.isFinite(d.level)||!Array.isArray(d.pets))throw Error();normalizeSave(d);S=d;save();render();alert('Save berjaya diimport.')}catch(e){alert('Fail save tidak sah.')}};r.readAsText(f)};input.click()}
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}
render();
</script>
</body></html>
