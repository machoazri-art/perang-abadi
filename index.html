<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="./manifest.webmanifest">

<title>⚔️ Perang Abadi — RPG Teks</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:28px max(14px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom));min-height:100vh;background:radial-gradient(circle at 50% 0%,#1a1f2e 0%,#0a0c11 70%);color:#d8dce6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:680px}h1{font-size:22px;text-align:center;letter-spacing:2px;margin:8px 0 18px;color:#ffb347;text-shadow:0 0 14px #ff8c0073}
.panel{background:#161a24eb;border:1px solid #2c3446;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 4px 20px #0008}
.panel h2{font-size:13px;margin:0 0 10px;color:#9aa8c7;letter-spacing:1.3px;text-transform:uppercase;border-bottom:1px solid #2c3446;padding-bottom:7px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:6px 0}.row span:last-child{color:#fff;font-weight:bold;text-align:right}
.bar{height:9px;background:#1b2130;border-radius:6px;overflow:hidden;margin:4px 0 8px;border:1px solid #2c3446}.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.hp i{background:linear-gradient(90deg,#e5443b,#ff7a5c)}.xp i{background:linear-gradient(90deg,#3a7bd5,#4fd1c5)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:7px}
button{font:inherit;font-size:13px;min-height:44px;padding:11px 8px;cursor:pointer;background:#232b3d;color:#cfe0ff;border:1px solid #3b4761;border-radius:9px;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.985)}button:disabled{opacity:.35;cursor:not-allowed}button.primary{background:#7a2a1f;border-color:#c0392b;color:#ffd9c9;grid-column:1/-1}button.gold{background:#3d3418;border-color:#8a7530;color:#ffe08a}
input{width:100%;padding:12px;font:inherit;font-size:16px;background:#161b26;border:1px solid #3b4761;border-radius:8px;color:white;margin:5px 0 10px}
#log{background:#0c0f16;border:1px solid #242c3c;border-radius:8px;padding:10px;height:170px;overflow:auto;font-size:12.5px;line-height:1.65;margin-bottom:12px;overflow-wrap:anywhere}
.notice,.petcard,.enemycard{padding:11px;border-radius:9px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.notice{background:#ffb4461a;border:1px solid #8a6a25;color:#ffd98a;white-space:pre-line}
.petcard{background:#5a3c8a24;border:1px solid #4a3a6d}.enemycard{background:#8c282826;border:1px solid #6d2a2a}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:#2b3550;color:#9db4e0}.empty,.small{color:#8791a6;font-size:12px}.empty{text-align:center;padding:10px;font-style:italic}.center{text-align:center}
.footer{color:#69758b;text-align:center;font-size:10px;padding:4px}
@media(min-width:520px){body{padding-top:32px}.panel{padding:16px}}
</style>
</head>
<body>
<div id="app"><h1>⚔️ PERANG ABADI ⚔️</h1><div id="screen"></div><div class="footer">PERANG ABADI · EDISI PWA</div></div>
<script>
const SAVE_KEY='perangAbadi_save_v1';
const BACKUP_KEY='perangAbadi_save_backup_v1';
const TEMP_KEY='perangAbadi_save_temp_v1';
const SAVE_SCHEMA_VERSION=4;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PET_TYPES={
 wolf:{label:'🐺 Serigala',cost:80,baseAtk:10,baseHp:45,passive:'+3 Serangan anda'},
 bear:{label:'🐻 Beruang',cost:150,baseAtk:8,baseHp:75,passive:'-2 Kerosakan diterima'},
 eagle:{label:'🦅 Elang',cost:220,baseAtk:13,baseHp:40,passive:'20% Peluang Kritikal'},
 dragon:{label:'🐉 Naga',cost:500,baseAtk:18,baseHp:95,passive:'+6 Serangan anda'}
};
const PET_NAMES=['Bayangan','Badai','Bara','Kilat','Taring','Guntur','Rembulan','Abu','Salju','Nyala','Belati','Kabut'];
const ENEMIES={
1:[{n:'Penyamun Jalanan',hp:45,atk:11,def:2,xp:35,gold:18},{n:'Serigala Liar',hp:40,atk:13,def:1,xp:32,gold:15},{n:'Goblin Penyamun',hp:52,atk:10,def:3,xp:38,gold:22}],
2:[{n:'Orc Buas',hp:80,atk:17,def:5,xp:60,gold:35},{n:'Pahlawan Upahan',hp:90,atk:15,def:7,xp:65,gold:40},{n:'Troll Kecil',hp:100,atk:19,def:4,xp:70,gold:38}],
3:[{n:'Kesatria Gelap',hp:130,atk:24,def:9,xp:100,gold:60},{n:'Wyvern',hp:120,atk:28,def:7,xp:105,gold:65},{n:'Necromancer',hp:110,atk:30,def:6,xp:110,gold:70}],
4:[{n:'Gergasi Perang',hp:190,atk:35,def:12,xp:160,gold:95},{n:'Panglima Iblis',hp:170,atk:40,def:10,xp:170,gold:100},{n:'Naga Hitam',hp:210,atk:38,def:14,xp:180,gold:110}],
5:[{n:'Raja Iblis',hp:400,atk:55,def:18,xp:400,gold:300}],
6:[{n:'Penjaga Makam',hp:460,atk:62,def:22,xp:480,gold:360},{n:'Kesatria Terlarang',hp:510,atk:58,def:26,xp:500,gold:380},{n:'Penyihir Tulang',hp:430,atk:68,def:18,xp:520,gold:400}],
7:[{n:'Raksasa Abyss',hp:620,atk:76,def:30,xp:650,gold:480},{n:'Hydra Berkepala Tiga',hp:700,atk:72,def:28,xp:680,gold:500},{n:'Warden Kegelapan',hp:660,atk:82,def:32,xp:700,gold:520}],
8:[{n:'Malaikat Jatuh',hp:850,atk:95,def:38,xp:900,gold:700},{n:'Kaisar Void',hp:980,atk:100,def:42,xp:1000,gold:800},{n:'Dewa Kemusnahan',hp:1200,atk:110,def:48,xp:1200,gold:1000}]};
const CHAPTER_NAME={1:'Hutan Sempadan',2:'Dataran Orc',3:'Runtuhan Purba',4:'Pintu Gerbang Neraka',5:'Takhta Iblis',6:'Makam Larangan',7:'Jurang Abyss',8:'Takhta Kebinasaan'};
const GEAR={weapons:[{id:'iron',name:'Pedang Besi',atk:5,cost:90,rarity:'Common'},{id:'knight',name:'Pedang Ksatria',atk:12,cost:260,rarity:'Rare'},{id:'dragon',name:'Pedang Naga',atk:22,cost:650,rarity:'Epic'}],armors:[{id:'leather',name:'Perisai Kulit',def:3,cost:90,rarity:'Common'},{id:'steel',name:'Perisai Baja',def:8,cost:280,rarity:'Rare'},{id:'abyss',name:'Zirah Neraka',def:15,cost:700,rarity:'Epic'}]};
const CLASSES={warrior:{name:'Warrior',label:'⚔️ Warrior',desc:'+4 serangan asas',atk:4,crit:0,skill:0},assassin:{name:'Assassin',label:'🗡️ Assassin',desc:'15% peluang kritikal',atk:0,crit:.15,skill:0},mage:{name:'Mage',label:'🔮 Mage',desc:'Kemahiran serangan +0.5x kerosakan',atk:0,crit:0,skill:.5}};
const RARITIES=[{name:'Common',weight:55,mult:1,color:'#cbd5e1'},{name:'Rare',weight:27,mult:1.35,color:'#60a5fa'},{name:'Epic',weight:13,mult:1.8,color:'#c084fc'},{name:'Legendary',weight:4,mult:2.5,color:'#fbbf24'},{name:'Mythic',weight:1,mult:3.5,color:'#fb7185'}];
const MATERIALS={iron:0,crystal:0,scale:0};
const SKILLS={power:{name:'Tebasan Perkasa',level:2,desc:'Serangan 2.2x kerosakan',mult:2.2},flame:{name:'Amukan Naga',level:5,desc:'Serangan 3.2x kerosakan',mult:3.2},guard:{name:'Benteng Jiwa',level:3,desc:'Kurangkan kerosakan musuh 70% untuk satu giliran',guard:true}};
const QUESTS=[{id:'first-blood',name:'Permulaan Perjuangan',desc:'Menang 3 pertempuran',target:3,stat:'wins',gold:100,xp:60},{id:'scavenger',name:'Pengumpul Bahan',desc:'Kumpul 5 bahan daripada musuh',target:5,stat:'materials',gold:120,xp:80},{id:'boss-hunter',name:'Pemburu Bos',desc:'Tewaskan 1 bos',target:1,stat:'bosses',gold:200,xp:150}];
let S=null,busy=false;const screen=document.getElementById('screen');
function save(){if(!S)return;try{const payload=JSON.stringify({...S,saveSchemaVersion:SAVE_SCHEMA_VERSION,lastSavedAt:new Date().toISOString()});const old=localStorage.getItem(SAVE_KEY);if(old){try{JSON.parse(old);localStorage.setItem(BACKUP_KEY,old)}catch(e){}}localStorage.setItem(TEMP_KEY,payload);const check=localStorage.getItem(TEMP_KEY);JSON.parse(check);localStorage.setItem(SAVE_KEY,check);localStorage.removeItem(TEMP_KEY)}catch(e){notice('⚠️ Simpanan gagal disimpan. Salinan lama dikekalkan jika tersedia; sila Eksport Simpanan.')}}
function normalizeSave(d){if(!d||typeof d!=='object')throw Error('Simpanan tidak sah');d.gear=d.gear||{weapon:null,armor:null};d.skills=Array.isArray(d.skills)?d.skills:[];d.skillPoints=Number.isFinite(d.skillPoints)?d.skillPoints:0;d.usedKemahirans=Array.isArray(d.usedKemahirans)?d.usedKemahirans:[];d.dungeonFloor=Number.isFinite(d.dungeonFloor)?d.dungeonFloor:0;d.class=CLASSES[d.class]?d.class:'warrior';d.materials=Object.assign({...MATERIALS},d.materials||{});d.inventory=Array.isArray(d.inventory)?d.inventory.filter(x=>x&&typeof x==='object').slice(0,40):[];d.questStats=Object.assign({wins:0,materials:0,bosses:0},d.questStats||{});d.completedQuests=Array.isArray(d.completedQuests)?d.completedQuests:[];d.enemyLevel=Math.max(1,Math.min(Number(d.level)||1,Number(d.enemyLevel)||Number(d.level)||1));d.chapter=Math.max(1,Math.min(8,Number(d.chapter)||1));d.pets=Array.isArray(d.pets)?d.pets:[];d.playerStatus=[];d.enemyStatus=[];d.dodgeNext=false;d.counterNext=false;d.saveSchemaVersion=SAVE_SCHEMA_VERSION;d.inBattle=false;d.enemy=null;d.defending=false;return d}
function loadSave(){for(const key of [SAVE_KEY,BACKUP_KEY,TEMP_KEY]){try{const raw=localStorage.getItem(key);if(!raw)continue;const d=normalizeSave(JSON.parse(raw));if(key!==SAVE_KEY){S=d;save();}return d}catch(e){}}return null}
function hasSave(){return !!(localStorage.getItem(SAVE_KEY)||localStorage.getItem(BACKUP_KEY))}
function newState(name,heroClass){return{name:name||'Pahlawan',class:CLASSES[heroClass]?heroClass:'warrior',level:1,xp:0,xpNext:100,hp:100,maxHp:100,atk:10,def:5,gold:60,potions:3,wins:0,chapter:1,pets:[],activeIdx:-1,inBattle:false,enemy:null,defending:false,log:[],notice:'',gear:{weapon:null,armor:null},skills:[],skillPoints:0,usedKemahirans:[],dungeonFloor:0,materials:{...MATERIALS},inventory:[],questStats:{wins:0,materials:0,bosses:0},completedQuests:[],enemyLevel:1,playerStatus:[],enemyStatus:[],dodgeNext:false,counterNext:false}}
const getPet=()=>S&&S.activeIdx>=0&&S.pets[S.activeIdx]?S.pets[S.activeIdx]:null;
function pushLog(t){S.log.push(t);if(S.log.length>60)S.log.shift()}
function notice(t){S.notice=S.notice?S.notice+'\n'+t:t}
function gainXp(x){S.xp+=x;while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=Math.round(S.xpNext*1.35);S.skillPoints=(S.skillPoints||0)+1;S.maxHp+=25;S.hp=S.maxHp;S.atk+=4;S.def+=2;notice(`⭐ NAIK TAHAP ${S.level}! Serangan +4 · Pertahanan +2 · HP Maksimum +25`)}}
function petGainXp(p,x){p.xp+=x;while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(p.xpNext*1.4);p.maxHp+=12;p.hp=p.maxHp;p.atk+=3;notice(`🐾 ${p.name} naik ke Tahap ${p.level}!`)}}
function spawnEnemy(){const ch=Math.min(8,S.chapter),pool=ENEMIES[ch],b=ch===5?pool[0]:pool[rand(0,pool.length-1)],level=Math.max(1,Math.min(S.level,Number(S.enemyLevel)||S.level)),scale=.35+.65*(level/Math.max(1,S.level)),ratio=level/Math.max(1,S.level),boss=(S.wins+1)%4===0,e={name:(boss?'👑 ':'')+b.n+(boss?' [BOS]':''),level,maxHp:Math.max(8,Math.round(b.hp*scale*(boss?2.2:1))),atk:Math.max(1,Math.round(b.atk*scale*(boss?1.4:1))),def:Math.max(0,Math.round(b.def*scale*(boss?1.3:1))),xp:Math.max(1,Math.round(b.xp*scale*(.5+ratio)*(boss?3:1))),gold:Math.max(1,Math.round(b.gold*scale*(.5+ratio)*(boss?3.5:1))),boss};e.hp=e.maxHp;e.phase=1;e.guard=0;return e}
function bar(cls,cur,max){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,cur/max*100))}%"></i></div>`}
function render(){if(!S)renderStart();else if(S.inBattle)renderBattle();else renderHub()}
function renderStart(){const ada=hasSave();screen.innerHTML=`<div class="panel center"><p style="font-size:13px;line-height:1.7;color:#9aa8c7">Dunia sedang terbakar. Kerajaan terakhir kini berada di ambang kemusnahan.<br>Anda satu-satunya harapan — bersama teman berbulu atau bersisik.<br><br><span class="small">Bertarunglah, naiklah level, bela haiwan teman.</span></p></div><div class="panel"><h2>Mulakan Pengembaraan</h2><input id="nameInput" maxlength="14" placeholder="Nama pahlawan anda..." value="Pahlawan"><label class="small" for="classInput">Pilih kelas watak</label><select id="classInput" style="width:100%;padding:12px;background:#161b26;color:white;border:1px solid #3b4761;border-radius:8px;font:inherit;margin-bottom:10px"><option value="warrior">⚔️ Warrior — +4 serangan</option><option value="assassin">🗡️ Assassin — 15% kritikal</option><option value="mage">🔮 Mage — skill +0.5x kerosakan</option></select><div class="btns"><button class="primary" onclick="startNew()">🗡️ Mulakan Permainan Baharu</button>${ada?'<button onclick="continueGame()" style="grid-column:1/-1">💾 Sambung Pengembaraan</button>':''}</div></div>`}
function startNew(){if(hasSave()&&!confirm('Simpanan lama ditemui. Mulakan game baru akan menggantikan simpanan semasa. eksport simpanan dahulu jika mahu menyimpan kedua-duanya. Teruskan?'))return;const v=document.getElementById('nameInput');S=newState(v&&v.value.trim()?v.value.trim().slice(0,14):'Pahlawan',document.getElementById('classInput')?.value||'warrior');notice(`Selamat datang, ${S.name}. Pengembaraan anda bermula di ${CHAPTER_NAME[1]}.`);save();render()}
function continueGame(){const d=loadSave();if(d){S=d;render()}}
function renderHub(){const p=getPet(),xpPct=Math.round(S.xp/S.xpNext*100);screen.innerHTML=`${S.notice?`<div class="notice">${S.notice.replace(/\n/g,'<br>')}</div>`:''}<div class="panel"><h2>${S.name} · Tahap ${S.level} · ${CLASSES[S.class||'warrior'].label}</h2><div class="row"><span>Kelas</span><span>${CLASSES[S.class||'warrior'].desc}</span></div><div class="row"><span>❤️ HP</span><span>${S.hp}/${S.maxHp}</span></div>${bar('hp',S.hp,S.maxHp)}<div class="row"><span>✨ XP</span><span>${S.xp}/${S.xpNext} (${xpPct}%)</span></div>${bar('xp',S.xp,S.xpNext)}<div class="row"><span>⚔️ Serangan</span><span>${S.atk}</span></div><div class="row"><span>🛡️ Pertahanan</span><span>${S.def}</span></div><div class="row"><span>🧪 Ramuan</span><span>${S.potions}</span></div><div class="row"><span>💰 Emas</span><span>${S.gold}</span></div><div class="row"><span>🏆 Kemenangan</span><span>${S.wins}</span></div><div class="row"><span>🗺️ Wilayah</span><span>Bab ${S.chapter} — ${CHAPTER_NAME[S.chapter]}</span></div></div><div class="panel"><h2>Haiwan Kesayangan</h2>${p?`<div class="petcard"><div class="row"><span>${PET_TYPES[p.type].label} <b>${p.name}</b></span><span>Tahap ${p.level}</span></div>${bar('hp',p.hp,p.maxHp)}<div class="row"><span>❤️ ${p.hp}/${p.maxHp}</span><span>⚔️ ${p.atk}</span></div><div class="row"><span>✨ ${p.xp}/${p.xpNext}</span><span class="small">${PET_TYPES[p.type].passive}</span></div>${p.hp<=0?'<div class="small">😵 Pengsan — berehat untuk memulihkan</div>':''}</div>`:'<div class="empty">Anda belum mempunyai haiwan kesayangan. Ambil haiwan di Kedai 🛒</div>'}</div><div class="panel"><h2>🎯 Tahap Musuh untuk Farming</h2><div class="row"><span>Level musuh</span><span>${S.enemyLevel||S.level} / ${S.level}</span></div><select id="enemyLevelSelect" onchange="setEnemyLevel(this.value)" style="width:100%;padding:12px;background:#161b26;color:white;border:1px solid #3b4761;border-radius:8px;font:inherit;margin:6px 0 8px">${Array.from({length:Math.max(1,S.level)},(_,i)=>{const lv=i+1;return `<option value="${lv}" ${lv===(S.enemyLevel||S.level)?'selected':''}>Level ${lv}${lv===S.level?' — Maksimum':''}</option>`}).join('')}</select><div class="small">Level rendah lebih mudah untuk farming. Level tinggi beri ganjaran lebih baik tetapi musuh lebih kuat.</div></div><div class="panel"><h2>Aksi</h2><div class="btns"><button class="primary" onclick="cariMusuh()">⚔️ Cari Musuh</button><button class="gold" onclick="berehat()">🏕️ Berehat (20 💰)</button><button onclick="bukaKedai()">🛒 Kedai</button><button onclick="bukaInventori()">🎒 Inventori (${S.inventory?.length||0})</button><button onclick="bukaMisi()">📜 Misi</button><button onclick="bukaKandang()">🐾 Kandang</button><button onclick="bukaKelengkapan()">⚔️ Kelengkapan</button><button onclick="bukaKemahiranTree()">✨ Pokok Kemahiran (${S.skillPoints||0} SP)</button><button onclick="bukaBlacksmith()">⚒️ Tukang Besi</button><button onclick="bukaPembuatan()">🧰 Pembuatan</button><button onclick="masukDungeon()">🏰 Kurungan Bawah Tanah</button><button class="gold" onclick="lawanWorldBoss()">👑 Bos Dunia</button>${S.dungeonFloor>0?'<button class="gold" onclick="terusDungeon()">➡️ Sambung Kurungan Bawah Tanah (Aras '+S.dungeonFloor+')</button><button onclick="keluarDungeon()">🚪 Keluar Kurungan Bawah Tanah</button>':''}<button onclick="simpanManual()">💾 Simpan</button><button onclick="exportSave()">📤 Eksport Simpanan</button><button onclick="importSave()">📥 Import Simpanan</button><button onclick="hapusSave()">🗑️ Padam Simpanan</button></div></div>`}
function renderBattle(){const p=getPet(),e=S.enemy,logs=S.log.slice(-25).map(x=>`<div>${x}</div>`).join('');screen.innerHTML=`<div class="enemycard"><div class="row"><span style="font-size:14px;color:#ff8a70"><b>${e.name}</b></span><span>Tahap ${e.level||S.chapter}</span></div>${bar('hp',e.hp,e.maxHp)}<div class="row"><span>❤️ ${Math.max(0,e.hp)}/${e.maxHp}</span><span>⚔️ ${e.atk} · 🛡️ ${e.def}</span></div></div><div class="panel"><h2>Status Anda</h2>${bar('hp',S.hp,S.maxHp)}<div class="row"><span>❤️ ${S.hp}/${S.maxHp}</span><span>⚔️ ${S.atk} · 🛡️ ${S.def}</span></div>${p?`<div class="row"><span>${PET_TYPES[p.type].label} ${p.name}</span><span>❤️ ${p.hp}/${p.maxHp} · ⚔️ ${p.atk}</span></div>${bar('hp',p.hp,p.maxHp)}`:''}</div><div id="log">${logs}</div><div class="panel"><h2>Giliran Anda</h2><div class="btns"><button onclick="doTurn('attack')" ${busy?'disabled':''}>⚔️ Serang</button><button onclick="doTurn('skill')" ${busy||!S.skills.some(k=>['power','flame'].includes(k)&&!S.usedKemahirans.includes(k))?'disabled':''}>✨ Kemahiran</button><button onclick="doTurn('defend')" ${busy?'disabled':''}>🛡️ Bertahan</button><button onclick="doTurn('potion')" ${busy?'disabled':''}>🧪 Ramuan (${S.potions})</button><button onclick="doTurn('flee')" ${busy?'disabled':''}>🏃 Kabur</button></div></div>`;const l=document.getElementById('log');if(l)l.scrollTop=l.scrollHeight}
function setEnemyLevel(value){S.enemyLevel=Math.max(1,Math.min(S.level,Number(value)||1));save();renderHub()}
function cariMusuh(){if(S.hp<=0)S.hp=Math.round(S.maxHp*.3);S.enemyLevel=Math.max(1,Math.min(S.level,Number(S.enemyLevel)||S.level));S.enemy=spawnEnemy();S.inBattle=true;S.defending=false;S.usedKemahirans=[];S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;S.notice='';S.log=[];pushLog(`⚠️ ${S.enemy.name} menghalang perjalanan anda di ${CHAPTER_NAME[S.chapter]}!`);save();render()}
function berehat(){if(S.gold<20){S.notice='💰 Emas tidak mencukupi untuk berehat (memerlukan 20).';render();return}S.gold-=20;S.hp=S.maxHp;const p=getPet();if(p)p.hp=p.maxHp;S.notice='🏕️ Anda berehat. HP dan haiwan peliharaanmu pulih sepenuhnya.';save();render()}
function simpanManual(){save();S.notice='💾 Permainan tersimpan.';render()}
function hapusSave(){if(!confirm('Hapus semua data permainan? Tindakan ini tidak boleh dibatalkan.'))return;localStorage.removeItem(SAVE_KEY);S=null;renderStart()}
function bukaKedai(){let out='';for(const k in PET_TYPES){const t=PET_TYPES[k],owned=S.pets.some(p=>p.type===k);out+=`<button ${owned||S.gold<t.cost?'disabled':''} onclick="beliPet('${k}')">${t.label}<br><span class="small">${t.cost} 💰 · ${t.passive}</span>${owned?'<br><span class="small">✔ telah dimiliki</span>':''}</button>`}screen.innerHTML=`<div class="panel"><h2>🛒 Kedai Perang</h2><div class="row"><span>💰 Emas anda</span><span>${S.gold}</span></div></div><div class="panel"><h2>Ramuan</h2><button class="gold" ${S.gold<25?'disabled':''} onclick="beliPotion()">🧪 Beli Ramuan (25 💰)<br><span class="small">Pulihkan 50+ HP ketika bertarung</span></button></div><div class="panel"><h2>Dapatkan Haiwan Teman</h2><div class="btns">${out}</div><p class="small">Maksimum 4 haiwan. Satu haiwan aktif bertarung bersama anda.</p></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function beliPotion(){if(S.gold<25)return;S.gold-=25;S.potions++;save();bukaKedai()}
function beliPet(k){const t=PET_TYPES[k];if(S.gold<t.cost||S.pets.some(p=>p.type===k))return;if(S.pets.length>=4){alert('Kandang sudah penuh (maksimum 4 haiwan).');return}S.gold-=t.cost;const p={type:k,name:PET_NAMES[rand(0,PET_NAMES.length-1)],level:1,xp:0,xpNext:60,atk:t.baseAtk,hp:t.baseHp,maxHp:t.baseHp};S.pets.push(p);if(S.activeIdx<0)S.activeIdx=S.pets.length-1;save();bukaKedai()}
function bukaKandang(){let html=S.pets.length?S.pets.map((p,i)=>`<div class="petcard" style="margin-bottom:10px"><div class="row"><span>${PET_TYPES[p.type].label} <b>${p.name}</b> ${i===S.activeIdx?'<span class="tag">AKTIF</span>':''}</span><span>Tahap ${p.level}</span></div>${bar('hp',p.hp,p.maxHp)}<div class="row"><span>❤️ ${p.hp}/${p.maxHp}</span><span>⚔️ ${p.atk}</span></div><div class="row"><span>✨ ${p.xp}/${p.xpNext}</span><span class="small">${PET_TYPES[p.type].passive}</span></div><div class="btns"><button ${i===S.activeIdx?'disabled':''} onclick="setAktif(${i})">⭐ Jadikan Aktif</button><button onclick="lepasPet(${i})">🕊️ Lepaskan</button></div></div>`).join(''):'<div class="empty">Kandang kosong. Ambil sebagai teman haiwan di Kedai 🛒</div>';screen.innerHTML=`<div class="panel"><h2>🐾 Kandang</h2>${html}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function setAktif(i){S.activeIdx=i;save();bukaKandang()}
function lepasPet(i){if(!confirm(`Lepaskan ${S.pets[i].name} selamanya?`))return;S.pets.splice(i,1);if(S.activeIdx>=S.pets.length)S.activeIdx=S.pets.length-1;save();bukaKandang()}
function kembali(){save();render()}
function applyCombatStatus(target,type,turns,power){const list=target==='enemy'?S.enemyStatus:S.playerStatus;const found=list.find(x=>x.type===type);if(found){found.turns=Math.max(found.turns,turns);found.power=Math.max(found.power,power)}else list.push({type,turns,power})}
function tickCombatStatus(target){const list=target==='enemy'?S.enemyStatus:S.playerStatus;for(let i=list.length-1;i>=0;i--){const x=list[i],d=Math.max(1,x.power||2);if(target==='enemy'){S.enemy.hp-=d;pushLog('☠️ Kesan status musuh: -'+d+' HP')}else{S.hp-=d;pushLog('☠️ Kesan status anda: -'+d+' HP')}if(--x.turns<=0)list.splice(i,1)}}
function checkBossPhase(){const e=S.enemy;if(e&&e.boss&&(e.phase||1)===1&&e.hp<=e.maxHp*.5){e.phase=2;e.atk=Math.round(e.atk*1.35);e.def=Math.round(e.def*1.2);pushLog('👑 BOS MEMASUKI FASA KEDUA! Serangan dan pertahanan meningkat.')}}
function playerAtkValue(){const p=getPet(),c=CLASSES[S.class||'warrior'];return S.atk+(c.atk||0)+(S.gear&&S.gear.weapon?S.gear.weapon.atk:0)+(p&&p.hp>0?(p.type==='wolf'?3:p.type==='dragon'?6:0):0)}
async function doTurn(action){if(!S||!S.inBattle||busy)return;busy=true;render();const p=getPet(),e=S.enemy;
if(action==='attack'){let crit=!!((p&&p.hp>0&&p.type==='eagle'&&Math.random()<.2)||(S.class==='assassin'&&Math.random()<.15)),d=Math.max(1,Math.round(playerAtkValue()-e.def/2+rand(-2,3)));if(crit)d=Math.round(d*2);e.hp-=d;if(Math.random()<.18)applyCombatStatus('enemy','bleed',2,Math.max(2,Math.round(d*.12)));pushLog(`⚔️ Anda menebas ${e.name} — <b>${d}</b> kerosakan${crit?' 💢 KRITIS!':''}`);checkBossPhase()}
else if(action==='skill'){const key=S.skills.includes('flame')&&!S.usedKemahirans.includes('flame')?'flame':S.skills.includes('power')&&!S.usedKemahirans.includes('power')?'power':null;if(!key){pushLog('❌ Tiada skill serangan tersedia.');busy=false;render();return}const sk=SKILLS[key],classBonus=CLASSES[S.class||'warrior'].skill||0,d=Math.max(1,Math.round(playerAtkValue()*(sk.mult+classBonus)-e.def/2+rand(-2,3)));e.hp-=d;S.usedKemahirans.push(key);if(key==='flame'||S.class==='mage')applyCombatStatus('enemy','burn',3,Math.max(3,Math.round(d*.1)));pushLog(`✨ ${sk.name}! ${e.name} menerima <b>${d}</b> kerosakan.`);checkBossPhase()}
else if(action==='dodge'){S.dodgeNext=true;pushLog('💨 Anda bersedia mengelak serangan seterusnya.')}else if(action==='counter'){S.counterNext=true;pushLog('⚡ Anda bersedia melakukan serangan balas.')}else if(action==='defend'){S.defending=true;const h=Math.round(S.maxHp*.08);S.hp=Math.min(S.maxHp,S.hp+h);pushLog(`🛡️ Anda bertahan & memulihkan <b>${h}</b> HP.`)}
else if(action==='potion'){if(S.potions<=0){pushLog('❌ Ramuan habis!');busy=false;render();return}S.potions--;const h=50+S.level*5;S.hp=Math.min(S.maxHp,S.hp+h);pushLog(`🧪 Anda meminum ramuan — <b>+${h}</b> HP.`)}
else if(action==='flee'){if(Math.random()<.6){pushLog('🏃 Anda berjaya melarikan diri!');S.inBattle=false;S.enemy=null;S.defending=false;S.notice='🏃 Anda berundur daripada pertempuran. Luka masih terasa...';busy=false;save();render();return}else pushLog('😰 Anda gagal kabur!')}
if(e.hp<=0){await sleep(250);busy=false;winBattle();return}tickCombatStatus('enemy');checkBossPhase();if(e.hp<=0){busy=false;winBattle();return}await sleep(300);render();
if(p&&p.hp>0&&S.inBattle){let d=Math.max(1,Math.round(p.atk-e.def/3+rand(-2,2)));e.hp-=d;pushLog(`🐾 ${p.name} menerkam — <b>${d}</b> kerosakan.`);if(e.hp<=0){await sleep(250);busy=false;winBattle();return}await sleep(300);render()}
if(!S.inBattle){busy=false;return}tickCombatStatus('player');if(S.hp<=0){S.hp=0;busy=false;gameOver();return}let move='normal';if(e.hp/e.maxHp<.35&&Math.random()<.22)move='heal';else if(Math.random()<.18)move='guard';else if(Math.random()<.2)move='heavy';let d=Math.max(1,Math.round(e.atk-(S.def+(S.gear&&S.gear.armor?S.gear.armor.def:0))/2+rand(-2,3)));if(move==='heal'){const h=Math.max(8,Math.round(e.maxHp*.08));e.hp=Math.min(e.maxHp,e.hp+h);pushLog('🧠 Musuh memulihkan '+h+' HP!');d=Math.round(d*.65)}if(move==='guard'){e.guard=Math.round(e.def*.8);pushLog('🛡️ Musuh mengambil posisi bertahan.')}if(move==='heavy'){d=Math.round(d*1.55);pushLog('💢 Musuh menyediakan serangan berat!')}if(e.guard>0){d=Math.max(1,d-e.guard);e.guard=0}if(S.dodgeNext){S.dodgeNext=false;if(Math.random()<.75){d=0;pushLog('💨 Anda berjaya mengelak!')}else pushLog('😵 Anda gagal mengelak!')}if(S.counterNext){S.counterNext=false;const cd=Math.max(1,Math.round(playerAtkValue()*.65));e.hp-=cd;pushLog('⚡ Serangan balas menyebabkan '+cd+' kerosakan!');checkBossPhase();if(e.hp<=0){busy=false;winBattle();return}}if(S.defending)d=Math.max(1,Math.round(d*(S.skills.includes('guard')?.15:.35)));if(p&&p.hp>0&&p.type==='bear')d=Math.max(0,d-2);S.defending=false;S.hp-=d;if(d>0&&Math.random()<.12)applyCombatStatus('player','poison',2,Math.max(2,Math.round(d*.1)));pushLog(`💥 ${e.name} menyerang anda — <b>${d}</b> kerosakan.`);
if(p&&p.hp>0&&Math.random()<.3){let pd=Math.max(1,Math.round(e.atk*.5-2+rand(-2,2)));p.hp-=pd;pushLog(`💢 ${p.name} terkena <b>${pd}</b> kerosakan.`);if(p.hp<=0){p.hp=0;pushLog(`😵 ${p.name} pengsan!`)}}
if(S.hp<=0){S.hp=0;await sleep(300);busy=false;gameOver();return}busy=false;save();render()}
function winBattle(){const e=S.enemy;S.wins++;S.questStats.wins=(S.questStats.wins||0)+1;if(e.boss)S.questStats.bosses=(S.questStats.bosses||0)+1;S.gold+=e.gold;awardLoot(e);gainXp(e.xp);const p=getPet();if(p){petGainXp(p,Math.round(e.xp*.6));p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*.5))}const old=S.chapter;S.chapter=Math.min(8,Math.floor(S.wins/4)+1);let msg=`🏆 Menang melawan ${e.name}! +${e.xp} XP · +${e.gold} 💰`;if(S.chapter>old){msg+=`\n🗺️ Anda memasuki wilayah baru: Bab ${S.chapter} — ${CHAPTER_NAME[S.chapter]}`;S.hp=Math.min(S.maxHp,S.hp+Math.round(S.maxHp*.4));if(p)p.hp=p.maxHp;msg+='\n💚 HP pulih sebagian kerana memasuki wilayah baru.'}notice(msg);S.inBattle=false;S.enemy=null;S.defending=false;S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;busy=false;save();render()}
function gameOver(){S.dungeonFloor=0;const lost=Math.round(S.gold*.2);S.gold-=lost;S.hp=Math.round(S.maxHp*.5);const p=getPet();if(p)p.hp=Math.max(1,Math.round(p.maxHp*.4));S.inBattle=false;S.enemy=null;S.defending=false;busy=false;notice(`💀 Anda tumbang dalam pertempuran! Kehilangan ${lost} 💰. Bangkit dan balas dendam!`);save();render()}
function pickRarity(){let roll=rand(1,100),sum=0;for(const r of RARITIES){sum+=r.weight;if(roll<=sum)return r}return RARITIES[0]}
function addInventoryItem(item){if(!Array.isArray(S.inventory))S.inventory=[];if(S.inventory.length>=40){notice('🎒 Inventori penuh. Barang rampasan ditukar kepada 20 emas.');S.gold+=20;return false}S.inventory.push(item);return true}
function awardLoot(e){const mat=['iron','crystal','scale'][rand(0,2)],qty=e.boss?3:1;S.materials[mat]=(S.materials[mat]||0)+qty;S.questStats.materials=(S.questStats.materials||0)+qty;let msg=`🧱 Bahan diperoleh: ${mat} +${qty}.`;if(e.boss||Math.random()<.18){const rarity=pickRarity(),isWeapon=Math.random()<.5,base=isWeapon?{name:'Bilah Perang',atk:rand(4,9)}:{name:'Zirah Pengembara',def:rand(3,7)},stat=isWeapon?'atk':'def',item={id:'loot-'+Date.now()+'-'+rand(1,9999),name:base.name,rarity:rarity.name,[stat]:Math.round(base[stat]*rarity.mult),upgrade:0,type:isWeapon?'weapon':'armor'};if(addInventoryItem(item)){const slot=isWeapon?'weapon':'armor',current=S.gear[slot],better=!current||item[stat]>=(current[stat]||0);if(better){if(current)addInventoryItem({...current,type:slot});S.gear[slot]=item;msg+=` 🎁 ${item.name} (${rarity.name}) terus dipakai kerana lebih kuat.`}else msg+=` 🎁 ${item.name} (${rarity.name}) disimpan dalam inventori.`}}notice(msg)}
function bukaInventori(){const items=S.inventory||[];const html=items.length?items.map((it,i)=>{const type=it.type||(Number.isFinite(it.atk)?'weapon':'armor'),stat=type==='weapon'?'ATK':'DEF',value=type==='weapon'?it.atk:it.def;return `<div class="petcard"><div class="row"><b>${it.name}</b><span class="tag">${it.rarity||'Common'}</span></div><div class="small">${stat} +${value||0} · Naik taraf ${it.upgrade||0}</div><div class="btns"><button onclick="equipInventori(${i})">⚔️ Pakai</button><button onclick="jualInventori(${i})">💰 Jual</button></div></div>`}).join(''):'<div class="empty">Inventori masih kosong. Kalahkan musuh untuk mendapatkan barang rampasan.</div>';screen.innerHTML=`<div class="panel"><h2>🎒 Inventori (${items.length}/40)</h2>${html}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function equipInventori(i){const item=S.inventory[i];if(!item)return;const slot=item.type||(Number.isFinite(item.atk)?'weapon':'armor'),current=S.gear[slot];if(current){S.inventory[i]={...current,type:slot}}else{S.inventory.splice(i,1)}S.gear[slot]={...item,type:slot};save();bukaInventori()}
function jualInventori(i){const item=S.inventory[i];if(!item)return;const value=Math.max(10,Math.round(((item.atk||item.def||1)*8)*(item.rarity==='Legendary'?2:item.rarity==='Mythic'?3:1)));S.inventory.splice(i,1);S.gold+=value;save();bukaInventori()}
function bukaMisi(){const html=QUESTS.map(q=>{const done=S.completedQuests.includes(q.id),progress=Math.min(q.target,S.questStats[q.stat]||0);return `<div class="petcard"><div class="row"><b>${q.name}</b><span class="tag">${done?'SELESAI':progress+'/'+q.target}</span></div><div class="small">${q.desc}</div><div class="small">Ganjaran: ${q.gold} emas · ${q.xp} XP</div><button style="width:100%;margin-top:8px" ${done||progress<q.target?'disabled':''} onclick="tuntutMisi('${q.id}')">${done?'✔ Ganjaran dituntut':progress<q.target?'Teruskan misi':'🎁 Tuntut ganjaran'}</button></div>`}).join('');screen.innerHTML=`<div class="panel"><h2>📜 Papan Misi</h2><p class="small">Selesaikan tugasan sambil meneruskan pengembaraan. Setiap ganjaran hanya boleh dituntut sekali.</p>${html}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function tuntutMisi(id){const q=QUESTS.find(x=>x.id===id);if(!q||S.completedQuests.includes(id)||(S.questStats[q.stat]||0)<q.target)return;S.completedQuests.push(id);S.gold+=q.gold;gainXp(q.xp);notice(`📜 Misi selesai: ${q.name}! +${q.gold} emas · +${q.xp} XP.`);save();bukaMisi()}
function bukaKelengkapan(){const weapon=S.gear.weapon,armor=S.gear.armor;const items=[...GEAR.weapons.map(x=>({...x,type:'weapon'})),...GEAR.armors.map(x=>({...x,type:'armor'}))];screen.innerHTML=`<div class="panel"><h2>⚔️ Kelengkapan Dipakai</h2><div class="row"><span>Senjata</span><span>${weapon?weapon.name+' (+'+weapon.atk+' ATK)':'Tiada'}</span></div><div class="row"><span>Perisai</span><span>${armor?armor.name+' (+'+armor.def+' DEF)':'Tiada'}</span></div><div class="row"><span>Jumlah Attack</span><span>${playerAtkValue()}</span></div><div class="row"><span>Jumlah Defense</span><span>${S.def+(armor?armor.def:0)}</span></div></div><div class="panel"><h2>Kedai Kelengkapan</h2><div class="btns">${items.map(x=>{const equipped=x.type==='weapon'?weapon:armor;const stat=x.type==='weapon'?'+'+x.atk+' ATK':'+'+x.def+' DEF';return `<button ${equipped&&equipped.id===x.id?'disabled':''} ${S.gold<x.cost?'disabled':''} onclick="beliKelengkapan('${x.type}','${x.id}')">${x.name}<br><span class="small">${stat} · ${x.cost} 💰</span></button>`}).join('')}</div></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function beliKelengkapan(type,id){const item=(type==='weapon'?GEAR.weapons:GEAR.armors).find(x=>x.id===id);if(!item||S.gold<item.cost)return;S.gold-=item.cost;S.gear[type]={...item};save();bukaKelengkapan()}
function bukaKemahiranTree(){screen.innerHTML=`<div class="panel"><h2>✨ Pokok Kemahiran</h2><div class="row"><span>Mata Kemahiran</span><span>${S.skillPoints||0} SP</span></div><p class="small">Setiap peningkatan tahap memberikan 1 Kemahiran Point. Kemahiran serangan boleh digunakan sekali setiap pertempuran.</p>${Object.entries(SKILLS).map(([id,sk])=>{const learned=S.skills.includes(id),eligible=S.level>=sk.level;return `<div class="petcard"><b>${sk.name}</b><div class="small">Memerlukan Tahap ${sk.level} · ${sk.desc}</div><button style="width:100%;margin-top:8px" ${learned||!eligible||(S.skillPoints||0)<1?'disabled':''} onclick="learnKemahiran('${id}')">${learned?'✔ Telah Dipelajari':!eligible?'🔒 Tahap belum mencukupi':'Pelajari (1 SP)'}</button></div>`}).join('')}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function learnKemahiran(id){const sk=SKILLS[id];if(!sk||S.skills.includes(id)||S.level<sk.level||S.skillPoints<1)return;S.skillPoints--;S.skills.push(id);save();bukaKemahiranTree()}
function masukDungeon(){if(S.hp<=0)S.hp=Math.round(S.maxHp*.3);if(S.dungeonFloor>0){terusDungeon();return}S.dungeonFloor=1;startDungeonFloor()}
function terusDungeon(){if(S.dungeonFloor<1)S.dungeonFloor=1;else S.dungeonFloor++;if(S.dungeonFloor>5){S.dungeonFloor=0;S.notice='🏆 Kurungan Bawah Tanah berjaya ditamatkan!';save();render();return}startDungeonFloor()}
function startDungeonFloor(){const base=spawnEnemy(),f=S.dungeonFloor;S.enemy={...base,name:`🏰 Kurungan Bawah Tanah F${f} — ${base.name}`,maxHp:Math.round(base.maxHp*(1+f*.35)),atk:Math.round(base.atk*(1+f*.16)),def:Math.round(base.def*(1+f*.12)),xp:Math.round(base.xp*(1+f*.5)),gold:Math.round(base.gold*(1+f*.6))};S.enemy.hp=S.enemy.maxHp;S.enemy.boss=true;S.enemy.phase=1;S.enemy.guard=0;S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;S.inBattle=true;S.defending=false;S.usedKemahirans=[];S.notice='';S.log=[];pushLog(`🏰 Anda memasuki Kurungan Bawah Tanah, Aras ${f}. Musuh semakin kuat!`);save();render()}
function keluarDungeon(){S.dungeonFloor=0;S.notice='🚪 Anda meninggalkan dungeon.';save();render()}
function bukaBlacksmith(){const w=S.gear.weapon,a=S.gear.armor;const rows=[['Senjata',w,'atk'],['Perisai',a,'def']];screen.innerHTML=`<div class="panel"><h2>⚒️ Tukang Besi</h2><p class="small">Naik taraf kelengkapan semasa. Setiap upgrade memerlukan emas dan bahan besi/kristal.</p>${rows.map(([label,item,stat])=>`<div class="petcard"><b>${label}: ${item?item.name:'Belum ada'}</b><div class="small">${item?item.rarity+' · '+stat.toUpperCase()+' +'+item[stat]+' · Naik Taraf '+(item.upgrade||0):'Dapatkan equipment melalui loot boss atau kedai.'}</div><button style="width:100%;margin-top:8px" ${!item||S.gold<100+(item.upgrade||0)*100||S.materials.iron<2?'disabled':''} onclick="upgradeGear('${stat==='atk'?'weapon':'armor'}')">Naik Taraf · ${100+(item?.upgrade||0)*100} 💰 + 2 Besi</button></div>`).join('')}<div class="row"><span>Bahan besi</span><span>${S.materials.iron}</span></div><div class="row"><span>Kristal</span><span>${S.materials.crystal}</span></div><div class="row"><span>Sisik naga</span><span>${S.materials.scale}</span></div></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function upgradeGear(slot){const item=S.gear[slot];if(!item)return;const cost=100+(item.upgrade||0)*100;if(S.gold<cost||S.materials.iron<2)return;S.gold-=cost;S.materials.iron-=2;const stat=slot==='weapon'?'atk':'def';item[stat]+=slot==='weapon'?3:2;item.upgrade=(item.upgrade||0)+1;save();bukaBlacksmith()}
function bukaPembuatan(){const recipes=[{id:'weapon',name:'Pedang Kristal',iron:5,crystal:3,scale:0,atk:16},{id:'armor',name:'Zirah Sisik Naga',iron:4,crystal:2,scale:3,def:12}];screen.innerHTML=`<div class="panel"><h2>🧰 Pembuatan</h2><p class="small">Gabungkan bahan yang dikumpul daripada pertempuran untuk menempa equipment.</p><div class="row"><span>Besi</span><span>${S.materials.iron}</span></div><div class="row"><span>Kristal</span><span>${S.materials.crystal}</span></div><div class="row"><span>Sisik Naga</span><span>${S.materials.scale}</span></div>${recipes.map(r=>`<div class="petcard"><b>${r.name}</b><div class="small">Bahan: ${r.iron} Besi · ${r.crystal} Kristal · ${r.scale} Sisik Naga</div><button style="width:100%;margin-top:8px" ${S.materials.iron<r.iron||S.materials.crystal<r.crystal||S.materials.scale<r.scale?'disabled':''} onclick="craftItem('${r.id}')">Buat</button></div>`).join('')}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function craftItem(id){const r=id==='weapon'?{name:'Pedang Kristal',iron:5,crystal:3,scale:0,atk:16}:{name:'Zirah Sisik Naga',iron:4,crystal:2,scale:3,def:12};if(S.materials.iron<r.iron||S.materials.crystal<r.crystal||S.materials.scale<r.scale)return;S.materials.iron-=r.iron;S.materials.crystal-=r.crystal;S.materials.scale-=r.scale;const slot=id==='weapon'?'weapon':'armor';S.gear[slot]={id:'crafted-'+id+'-'+Date.now(),name:r.name,rarity:'Epic',upgrade:0,[id==='weapon'?'atk':'def']:id==='weapon'?r.atk:r.def};save();bukaPembuatan()}
function lawanWorldBoss(){if(S.inBattle||busy)return;const base=ENEMIES[5][0];S.enemy={name:'🌑 WORLD BOSS — '+base.n,maxHp:Math.round(base.hp*5),hp:Math.round(base.hp*5),atk:Math.round(base.atk*1.8),def:Math.round(base.def*1.5),xp:base.xp*5,gold:base.gold*5,boss:true,phase:1,guard:0};S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;S.inBattle=true;S.usedKemahirans=[];S.defending=false;S.notice='';S.log=[];pushLog('👑 Bos Dunia muncul! Bersiaplah untuk pertempuran legenda.');save();render()}
function exportSave(){if(!S)return;const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='perang-abadi-save.json';a.click();URL.revokeObjectURL(url)}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.name||!Number.isFinite(d.level)||!Array.isArray(d.pets))throw Error();normalizeSave(d);S=d;save();render();alert('Simpanan berjaya diimport.')}catch(e){alert('Fail simpanan tidak sah.')}};r.readAsText(f)};input.click()}
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}
render();
</script>
</body></html>
