function renderStart(){const ada=hasSave();screen.innerHTML=`<div class="panel center"><p style="font-size:13px;line-height:1.7;color:#9aa8c7">Dunia sedang terbakar. Kerajaan terakhir kini berada di ambang kemusnahan.<br>Anda satu-satunya harapan — bersama teman berbulu atau bersisik.<br><br><span class="small">Bertarunglah, naiklah level, bela haiwan teman.</span></p></div><div class="panel"><h2>Mulakan Pengembaraan</h2><input id="nameInput" maxlength="14" placeholder="Nama pahlawan anda..." value="Pahlawan"><label class="small" for="classInput">Pilih kelas watak</label><select id="classInput" style="width:100%;padding:12px;background:#161b26;color:white;border:1px solid #3b4761;border-radius:8px;font:inherit;margin-bottom:10px"><option value="warrior">⚔️ Warrior — +4 serangan</option><option value="assassin">🗡️ Assassin — 15% kritikal</option><option value="mage">🔮 Mage — skill +0.5x kerosakan</option></select><div class="btns"><button class="primary" onclick="startNew()">🗡️ Mulakan Permainan Baharu</button>${ada?'<button onclick="continueGame()" style="grid-column:1/-1">💾 Sambung Pengembaraan</button>':''}</div></div>`}
function startNew(){if(hasSave()&&!confirm('Simpanan lama ditemui. Mulakan game baru akan menggantikan simpanan semasa. eksport simpanan dahulu jika mahu menyimpan kedua-duanya. Teruskan?'))return;const v=document.getElementById('nameInput');S=newState(v&&v.value.trim()?v.value.trim().slice(0,14):'Pahlawan',document.getElementById('classInput')?.value||'warrior');notice(`Selamat datang, ${S.name}. Pengembaraan anda bermula di ${CHAPTER_NAME[1]}.`);save();render()}

function renderHub(){const p=getPet(),xpPct=Math.round(S.xp/S.xpNext*100);screen.innerHTML=`<div class="panel dashboard"><div class="small">WILAYAH SEMASA</div><h2 style="font-size:16px;color:#f6d58b;border:0;margin:5px 0">🗺️ Bab ${S.chapter} · ${CHAPTER_NAME[S.chapter]}</h2><div class="dash-stats"><div class="dash-stat"><b>⚔️ ${S.wins}</b><span>KEMENANGAN</span></div><div class="dash-stat"><b>💰 ${S.gold}</b><span>EMAS</span></div><div class="dash-stat"><b>✨ ${S.skillPoints||0}</b><span>SKILL POINT</span></div></div><button class="primary" onclick="cariMusuh()">⚔️ MULAKAN PERTEMPURAN</button><button style="width:100%;margin-top:9px" onclick="switchCharacter()">👥 Tukar Watak</button><button class="gold" style="width:100%;margin-top:9px" onclick="bukaCerita()">📜 Kronik Kegelapan · 5 Bab</button><button style="width:100%;margin-top:9px" onclick="bukaPeta()">🗺️ Peta Dunia · 8 Wilayah</button><button class="gold" style="width:100%;margin-top:9px" onclick="cabarBossWilayah()">👑 Cabar Boss Wilayah</button></div>${S.notice?`<div class="notice">${S.notice.replace(/\n/g,'<br>')}</div>`:''}<div class="panel"><h2>${S.name} · Tahap ${S.level} · ${CLASSES[S.class||'warrior'].label}</h2><div class="row"><span>Kelas</span><span>${CLASSES[S.class||'warrior'].desc}</span></div><div class="row"><span>❤️ HP</span><span>${S.hp}/${S.maxHp}</span></div>${bar('hp',S.hp,S.maxHp)}<div class="row"><span>✨ XP</span><span>${S.xp}/${S.xpNext} (${xpPct}%)</span></div>${bar('xp',S.xp,S.xpNext)}<div class="row"><span>⚔️ Serangan</span><span>${S.atk}</span></div><div class="row"><span>🛡️ Pertahanan</span><span>${S.def}</span></div><div class="row"><span>🧪 Ramuan</span><span>${S.potions}</span></div><div class="row"><span>💰 Emas</span><span>${S.gold}</span></div><div class="row"><span>🏆 Kemenangan</span><span>${S.wins}</span></div><div class="row"><span>🗺️ Wilayah</span><span>Bab ${S.chapter} — ${CHAPTER_NAME[S.chapter]}</span></div></div><div class="panel"><h2>Haiwan Kesayangan</h2>${p?`<div class="petcard"><div class="row"><span>${PET_TYPES[p.type].label} <b>${p.name}</b></span><span>Tahap ${p.level}</span></div>${bar('hp',p.hp,p.maxHp)}<div class="row"><span>❤️ ${p.hp}/${p.maxHp}</span><span>⚔️ ${p.atk}</span></div><div class="row"><span>✨ ${p.xp}/${p.xpNext}</span><span class="small">${PET_TYPES[p.type].passive}</span></div>${p.hp<=0?'<div class="small">😵 Pengsan — berehat untuk memulihkan</div>':''}</div>`:'<div class="empty">Anda belum mempunyai haiwan kesayangan. Ambil haiwan di Kedai 🛒</div>'}</div><div class="panel"><h2>🎯 Tahap Musuh untuk Farming</h2><div class="row"><span>Level musuh</span><span>${S.enemyLevel||S.level} / ${S.level}</span></div><select id="enemyLevelSelect" onchange="setEnemyLevel(this.value)" style="width:100%;padding:12px;background:#161b26;color:white;border:1px solid #3b4761;border-radius:8px;font:inherit;margin:6px 0 8px">${Array.from({length:Math.max(1,S.level)},(_,i)=>{const lv=i+1;return `<option value="${lv}" ${lv===(S.enemyLevel||S.level)?'selected':''}>Level ${lv}${lv===S.level?' — Maksimum':''}</option>`}).join('')}</select><div class="small">Level rendah lebih mudah untuk farming. Level tinggi beri ganjaran lebih baik tetapi musuh lebih kuat.</div></div><div class="panel"><h2>Aksi</h2><div class="btns"><button class="primary" onclick="cariMusuh()">⚔️ Cari Musuh</button><button class="gold" onclick="berehat()">🏕️ Berehat (20 💰)</button><button onclick="bukaKedai()">🛒 Kedai</button><button onclick="bukaInventori()">🎒 Inventori (${S.inventory?.length||0})</button><button onclick="bukaMisi()">📜 Misi</button><button onclick="bukaKandang()">🐾 Kandang</button><button onclick="bukaKelengkapan()">⚔️ Kelengkapan</button><button onclick="bukaKemahiranTree()">✨ Pokok Kemahiran (${S.skillPoints||0} SP)</button><button onclick="bukaBlacksmith()">⚒️ Tukang Besi</button><button onclick="bukaPembuatan()">🧰 Pembuatan</button><button onclick="masukDungeon()">🏰 Kurungan Bawah Tanah</button><button class="gold" onclick="lawanWorldBoss()">👑 Bos Dunia</button>${S.dungeonFloor>0?'<button class="gold" onclick="terusDungeon()">➡️ Sambung Kurungan Bawah Tanah (Aras '+S.dungeonFloor+')</button><button onclick="keluarDungeon()">🚪 Keluar Kurungan Bawah Tanah</button>':''}<button onclick="simpanManual()">💾 Simpan</button><button onclick="exportSave()">📤 Eksport Simpanan</button><button onclick="importSave()">📥 Import Simpanan</button><button onclick="hapusSave()">🗑️ Padam Simpanan</button></div></div>`}
function renderBattle(){const p=getPet(),e=S.enemy,logs=S.log.slice(-25).map(x=>`<div>${x}</div>`).join(''),skillButtons=(S.skills||[]).map(k=>{const sk=SKILLS[k];if(!sk)return '';const cd=(S.skillCooldowns&&S.skillCooldowns[k])||0;return `<button onclick="doTurn('skill:${k}')" ${busy||cd>0?'disabled':''}>✨ ${sk.name}<br><span class="small">${cd>0?'Cooldown '+cd+' giliran':sk.guard?'Aktifkan pertahanan':'Sedia digunakan'}</span></button>`}).join('');screen.innerHTML=`<div class="enemycard"><div class="row"><span style="font-size:14px;color:#ff8a70"><b>${e.name}</b></span><span>Tahap ${e.level||S.chapter}</span></div>${bar('hp',e.hp,e.maxHp)}<div class="row"><span>❤️ ${Math.max(0,e.hp)}/${e.maxHp}</span><span>⚔️ ${e.atk} · 🛡️ ${e.def}</span></div><div class="small">${e.boss?'Fasa bos '+(e.phase||1)+'/2':'Musuh biasa'} · Kesan status: ${(S.enemyStatus||[]).map(x=>x.type).join(', ')||'Tiada'}</div></div><div class="panel"><h2>Status Anda</h2>${bar('hp',S.hp,S.maxHp)}<div class="row"><span>❤️ ${S.hp}/${S.maxHp}</span><span>⚔️ ${S.atk} · 🛡️ ${S.def}</span></div><div class="small">Kesan status: ${(S.playerStatus||[]).map(x=>x.type).join(', ')||'Tiada'}</div>${p?`<div class="row"><span>${PET_TYPES[p.type].label} ${p.name}</span><span>❤️ ${p.hp}/${p.maxHp} · ⚔️ ${p.atk}</span></div>${bar('hp',p.hp,p.maxHp)}`:''}</div><div id="log">${logs}</div><div class="panel"><h2>Giliran Anda</h2><div class="btns"><button onclick="doTurn('attack')" ${busy?'disabled':''}>⚔️ Serang</button>${skillButtons||'<div class="small">Belum ada kemahiran dipelajari.</div>'}<button onclick="doTurn('defend')" ${busy?'disabled':''}>🛡️ Bertahan</button><button onclick="doTurn('dodge')" ${busy?'disabled':''}>💨 Mengelak</button><button onclick="doTurn('counter')" ${busy?'disabled':''}>⚡ Counter</button><button onclick="doTurn('potion')" ${busy?'disabled':''}>🧪 Ramuan (${S.potions})</button><button onclick="doTurn('flee')" ${busy?'disabled':''}>🏃 Kabur</button></div></div>`;const l=document.getElementById('log');if(l)l.scrollTop=l.scrollHeight}
function setEnemyLevel(value){S.enemyLevel=Math.max(1,Math.min(S.level,Number(value)||1));save();renderHub()}
function cariMusuh(){if(S.hp<=0)S.hp=Math.round(S.maxHp*.3);S.enemyLevel=Math.max(1,Math.min(S.level,Number(S.enemyLevel)||S.level));S.enemy=spawnEnemy();S.inBattle=true;S.defending=false;S.usedKemahirans=[];S.skillCooldowns={};S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;S.notice='';S.log=[];pushLog(`⚠️ ${S.enemy.name} menghalang perjalanan anda di ${CHAPTER_NAME[S.chapter]}!`);save();render()}
function berehat(){if(S.gold<20){S.notice='💰 Emas tidak mencukupi untuk berehat (memerlukan 20).';render();return}S.gold-=20;S.hp=S.maxHp;const p=getPet();if(p)p.hp=p.maxHp;S.notice='🏕️ Anda berehat. HP dan haiwan peliharaanmu pulih sepenuhnya.';save();render()}
function simpanManual(){save();S.notice='💾 Permainan tersimpan.';render()}
function hapusSave(){if(!confirm('Hapus semua data permainan? Tindakan ini tidak boleh dibatalkan.'))return;localStorage.removeItem(SAVE_KEY);S=null;renderStart()}
function bukaKedai(){let out='';for(const k in PET_TYPES){const t=PET_TYPES[k],owned=S.pets.some(p=>p.type===k);out+=`<button ${owned||S.gold<t.cost?'disabled':''} onclick="beliPet('${k}')">${t.label}<br><span class="small">${t.cost} 💰 · ${t.passive}</span>${owned?'<br><span class="small">✔ telah dimiliki</span>':''}</button>`}screen.innerHTML=`<div class="panel"><h2>🛒 Kedai Perang</h2><div class="row"><span>💰 Emas anda</span><span>${S.gold}</span></div></div><div class="panel"><h2>Ramuan</h2><button class="gold" ${S.gold<25?'disabled':''} onclick="beliPotion()">🧪 Beli Ramuan (25 💰)<br><span class="small">Pulihkan 50+ HP ketika bertarung</span></button></div><div class="panel"><h2>Dapatkan Haiwan Teman</h2><div class="btns">${out}</div><p class="small">Maksimum 4 haiwan. Satu haiwan aktif bertarung bersama anda.</p></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function beliPotion(){if(S.gold<25)return;S.gold-=25;S.potions++;save();bukaKedai()}
function beliPet(k){const t=PET_TYPES[k];if(S.gold<t.cost||S.pets.some(p=>p.type===k))return;if(S.pets.length>=4){alert('Kandang sudah penuh (maksimum 4 haiwan).');return}S.gold-=t.cost;const p={type:k,name:PET_NAMES[rand(0,PET_NAMES.length-1)],level:1,xp:0,xpNext:60,atk:t.baseAtk,hp:t.baseHp,maxHp:t.baseHp};S.pets.push(p);if(S.activeIdx<0)S.activeIdx=S.pets.length-1;save();bukaKedai()}
function bukaKandang(){let html=S.pets.length?S.pets.map((p,i)=>`<div class="petcard" style="margin-bottom:10px"><div class="row"><span>${PET_TYPES[p.type].label} <b>${p.name}</b> ${i===S.activeIdx?'<span class="tag">AKTIF</span>':''}</span><span>Tahap ${p.level}</span></div>${bar('hp',p.hp,p.maxHp)}<div class="row"><span>❤️ ${p.hp}/${p.maxHp}</span><span>⚔️ ${p.atk}</span></div><div class="row"><span>✨ ${p.xp}/${p.xpNext}</span><span class="small">${PET_TYPES[p.type].passive}</span></div><div class="btns"><button ${i===S.activeIdx?'disabled':''} onclick="setAktif(${i})">⭐ Jadikan Aktif</button><button onclick="lepasPet(${i})">🕊️ Lepaskan</button></div></div>`).join(''):'<div class="empty">Kandang kosong. Ambil sebagai teman haiwan di Kedai 🛒</div>';screen.innerHTML=`<div class="panel"><h2>🐾 Kandang</h2>${html}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}
function setAktif(i){S.activeIdx=i;save();bukaKandang()}
function lepasPet(i){if(!confirm(`Lepaskan ${S.pets[i].name} selamanya?`))return;S.pets.splice(i,1);if(S.activeIdx>=S.pets.length)S.activeIdx=S.pets.length-1;save();bukaKandang()}
function kembali(){save();render()}
function applyCombatStatus(target,type,turns,power){const list=target==='enemy'?S.enemyStatus:S.playerStatus;const found=list.find(x=>x.type===type);if(found){found.turns=Math.max(found.turns,turns);found.power=Math.max(found.power,power)}else list.push({type,turns,power})}
function tickCombatStatus(target){const list=target==='enemy'?S.enemyStatus:S.playerStatus;for(let i=list.length-1;i>=0;i--){const x=list[i],d=Math.max(1,x.power||2);if(target==='enemy'){S.enemy.hp-=d;pushLog('☠️ Kesan status musuh: -'+d+' HP')}else{S.hp-=d;pushLog('☠️ Kesan status anda: -'+d+' HP')}if(--x.turns<=0)list.splice(i,1)}}
function checkBossPhase(){const e=S.enemy;if(e&&e.boss&&(e.phase||1)===1&&e.hp<=e.maxHp*.5){e.phase=2;e.atk=Math.round(e.atk*1.35);e.def=Math.round(e.def*1.2);pushLog('👑 BOS MEMASUKI FASA KEDUA! Serangan dan pertahanan meningkat.')}}
function playerAtkValue(){const p=getPet(),c=CLASSES[S.class||'warrior'];return S.atk+(c.atk||0)+(S.gear&&S.gear.weapon?S.gear.weapon.atk:0)+(p&&p.hp>0?(p.type==='wolf'?3:p.type==='dragon'?6:0):0)}
async function doTurn(action){if(!S||!S.inBattle||busy)return;busy=true;S.skillCooldowns=S.skillCooldowns||{};for(const k of Object.keys(S.skillCooldowns)){if(S.skillCooldowns[k]>0)S.skillCooldowns[k]--}render();const p=getPet(),e=S.enemy;
if(action==='attack'){let crit=!!((p&&p.hp>0&&p.type==='eagle'&&Math.random()<.2)||(S.class==='assassin'&&Math.random()<.15)),d=Math.max(1,Math.round(playerAtkValue()-e.def/2-(e.guard||0)+rand(-2,3)));if(crit)d=Math.round(d*2);e.guard=0;e.hp-=d;if(Math.random()<.18)applyCombatStatus('enemy','bleed',2,Math.max(2,Math.round(d*.12)));pushLog(`⚔️ Anda menebas ${e.name} — <b>${d}</b> kerosakan${crit?' 💢 KRITIS!':''}`);checkBossPhase()}
else if(action.startsWith('skill:')){const key=action.slice(6),sk=SKILLS[key];if(!S.skills.includes(key)||!sk||(S.skillCooldowns[key]||0)>0){pushLog('⏳ Kemahiran ini belum sedia digunakan.');busy=false;render();return}if(sk.guard){S.defending=true;S.skillCooldowns[key]=3;pushLog(`✨ ${sk.name}! Anda mengaktifkan benteng jiwa untuk mengurangkan serangan musuh.`)}else{const classBonus=CLASSES[S.class||'warrior'].skill||0,d=Math.max(1,Math.round(playerAtkValue()*(sk.mult+classBonus)-e.def/2-(e.guard||0)+rand(-2,3)));e.guard=0;e.hp-=d;S.skillCooldowns[key]=key==='flame'?4:3;if(key==='flame'||S.class==='mage')applyCombatStatus('enemy','burn',3,Math.max(3,Math.round(d*.1)));pushLog(`✨ ${sk.name}! ${e.name} menerima <b>${d}</b> kerosakan.`);checkBossPhase()}}
else if(action==='dodge'){S.dodgeNext=true;pushLog('💨 Anda bersedia mengelak serangan seterusnya.')}else if(action==='counter'){S.counterNext=true;pushLog('⚡ Anda bersedia melakukan serangan balas.')}else if(action==='defend'){S.defending=true;const h=Math.round(S.maxHp*.08);S.hp=Math.min(S.maxHp,S.hp+h);pushLog(`🛡️ Anda bertahan & memulihkan <b>${h}</b> HP.`)}
else if(action==='potion'){if(S.potions<=0){pushLog('❌ Ramuan habis!');busy=false;render();return}S.potions--;const h=50+S.level*5;S.hp=Math.min(S.maxHp,S.hp+h);pushLog(`🧪 Anda meminum ramuan — <b>+${h}</b> HP.`)}
else if(action==='flee'){if(Math.random()<.6){pushLog('🏃 Anda berjaya melarikan diri!');S.inBattle=false;S.enemy=null;S.defending=false;S.notice='🏃 Anda berundur daripada pertempuran. Luka masih terasa...';busy=false;save();render();return}else pushLog('😰 Anda gagal kabur!')}
if(e.hp<=0){await sleep(250);busy=false;winBattle();return}tickCombatStatus('enemy');checkBossPhase();if(e.hp<=0){busy=false;winBattle();return}await sleep(300);render();
if(p&&p.hp>0&&S.inBattle){let d=Math.max(1,Math.round(p.atk-e.def/3+rand(-2,2)));e.hp-=d;pushLog(`🐾 ${p.name} menerkam — <b>${d}</b> kerosakan.`);if(e.hp<=0){await sleep(250);busy=false;winBattle();return}await sleep(300);render()}
if(!S.inBattle){busy=false;return}tickCombatStatus('player');if(S.hp<=0){S.hp=0;busy=false;gameOver();return}let move='normal';if(e.hp/e.maxHp<.35&&Math.random()<.22)move='heal';else if(Math.random()<.18)move='guard';else if(Math.random()<.2)move='heavy';let d=Math.max(1,Math.round(e.atk-(S.def+(S.gear&&S.gear.armor?S.gear.armor.def:0))/2+rand(-2,3)));if(move==='heal'){const h=Math.max(8,Math.round(e.maxHp*.08));e.hp=Math.min(e.maxHp,e.hp+h);pushLog('🧠 Musuh memulihkan '+h+' HP!');d=Math.round(d*.65)}if(move==='guard'){e.guard=Math.round(e.def*.8);pushLog('🛡️ Musuh mengambil posisi bertahan.')}if(move==='heavy'){d=Math.round(d*1.55);pushLog('💢 Musuh menyediakan serangan berat!')}if(S.dodgeNext){S.dodgeNext=false;if(Math.random()<.75){d=0;pushLog('💨 Anda berjaya mengelak!')}else pushLog('😵 Anda gagal mengelak!')}if(S.counterNext){S.counterNext=false;const cd=Math.max(1,Math.round(playerAtkValue()*.65));e.hp-=cd;pushLog('⚡ Serangan balas menyebabkan '+cd+' kerosakan!');checkBossPhase();if(e.hp<=0){busy=false;winBattle();return}}if(S.defending)d=Math.max(1,Math.round(d*(S.skills.includes('guard')?.15:.35)));if(p&&p.hp>0&&p.type==='bear')d=Math.max(0,d-2);S.defending=false;S.hp-=d;if(d>0&&Math.random()<.12)applyCombatStatus('player','poison',2,Math.max(2,Math.round(d*.1)));pushLog(`💥 ${e.name} menyerang anda — <b>${d}</b> kerosakan.`);
if(p&&p.hp>0&&Math.random()<.3){let pd=Math.max(1,Math.round(e.atk*.5-2+rand(-2,2)));p.hp-=pd;pushLog(`💢 ${p.name} terkena <b>${pd}</b> kerosakan.`);if(p.hp<=0){p.hp=0;pushLog(`😵 ${p.name} pengsan!`)}}
if(S.hp<=0){S.hp=0;await sleep(300);busy=false;gameOver();return}busy=false;save();render()}
function winBattle(){const e=S.enemy;S.wins++;if(e.worldBoss){const ex=ensureWorld();if(!ex.bosses.includes(S.region))ex.bosses.push(S.region)}S.questStats.wins=(S.questStats.wins||0)+1;if(e.boss)S.questStats.bosses=(S.questStats.bosses||0)+1;S.gold+=e.gold;awardLoot(e);gainXp(e.xp);const p=getPet();if(p){petGainXp(p,Math.round(e.xp*.6));p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*.5))}const old=S.chapter;S.chapter=Math.min(8,Math.floor(S.wins/4)+1);let msg=`🏆 Menang melawan ${e.name}! +${e.xp} XP · +${e.gold} 💰`;if(S.chapter>old){S.region=S.chapter;msg+=`\n🗺️ Anda memasuki wilayah baru: Bab ${S.chapter} — ${CHAPTER_NAME[S.chapter]}`;S.hp=Math.min(S.maxHp,S.hp+Math.round(S.maxHp*.4));if(p)p.hp=p.maxHp;msg+='\n💚 HP pulih sebagian kerana memasuki wilayah baru.'}notice(msg);S.inBattle=false;S.enemy=null;S.defending=false;S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;busy=false;save();render()}
function gameOver(){S.dungeonFloor=0;const lost=Math.round(S.gold*.2);S.gold-=lost;S.hp=Math.round(S.maxHp*.5);const p=getPet();if(p)p.hp=Math.max(1,Math.round(p.maxHp*.4));S.inBattle=false;S.enemy=null;S.defending=false;busy=false;notice(`💀 Anda tumbang dalam pertempuran! Kehilangan ${lost} 💰. Bangkit dan balas dendam!`);save();render()}
function pickRarity(){let roll=rand(1,100),sum=0;for(const r of RARITIES){sum+=r.weight;if(roll<=sum)return r}return RARITIES[0]}
function addInventoryItem(item){if(!Array.isArray(S.inventory))S.inventory=[];if(S.inventory.length>=40){notice('🎒 Inventori penuh. Barang rampasan ditukar kepada 20 emas.');S.gold+=20;return false}S.inventory.push(item);return true}

 const roll=rand(1,100),mat=roll<=60?'iron':roll<=85?'crystal':'scale',qty=mat==='iron'?(e.boss?5:2):(e.boss?3:1);

  const baseValue=relic?relic.base:(isWeapon?rand(5,10):rand(4,8));
  const item={id:'loot-'+Date.now()+'-'+rand(1,9999),name:baseName+(rarity.name==='Common'?'':' '+rarity.name),baseName:baseName,rarity:rarity.name,affix:affix.name,source:e.boss?'Boss':'Monster',bossRelic:!!relic,[stat]:Math.round(baseValue*rarity.mult)+affix.bonus,upgrade:0,type:isWeapon?'weapon':'armor'};

  if(rarity.name==='Legendary')S.lootStats.legendaryDrops++;if(rarity.name==='Mythic')S.lootStats.mythicDrops++;
  S.lootStats.collected[baseName]=(S.lootStats.collected[baseName]||0)+1;

 }else msg+=' Tiada equipment kali ini.';
 notice(msg)
}
function bukaInventori(){const items=S.inventory||[];const html=items.length?items.map((it,i)=>{const type=it.type||(Number.isFinite(it.atk)?'weapon':'armor'),stat=type==='weapon'?'ATK':'DEF',value=type==='weapon'?it.atk:it.def;return '<div class="petcard"><div class="row"><b>'+it.name+'</b><span class="tag">'+(it.rarity||'Common')+'</span></div><div class="small">'+stat+' +'+(value||0)+' · '+(it.affix?'Affix: '+it.affix+' · ':'')+(it.source?'Drop: '+it.source+' · ':'')+'Naik taraf '+(it.upgrade||0)+'</div><div class="btns"><button onclick="equipInventori('+i+')">⚔️ Pakai</button><button onclick="jualInventori('+i+')">💰 Jual</button></div></div>'}).join(''):'<div class="empty">Inventori masih kosong. Kalahkan musuh untuk mendapatkan barang rampasan.</div>';screen.innerHTML='<div class="panel"><h2>🎒 Inventori ('+items.length+'/40)</h2><button class="gold" style="width:100%;margin-bottom:10px" onclick="bukaLootCodex()">📖 Loot Codex</button>'+html+'</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>'}
function bukaLootCodex(){const stats=S.lootStats||{},collected=stats.collected||{},entries=Object.entries(collected).sort((a,b)=>b[1]-a[1]);const rarityRows=RARITY_ORDER.map(r=>'<div class="row"><span>'+r+'</span><span>'+((stats.byRarity||{})[r]||0)+'</span></div>').join('');const list=entries.length?entries.map(([name,count])=>'<div class="row"><span>📦 '+name+'</span><span>×'+count+'</span></div>').join(''):'<div class="empty">Belum ada item direkodkan. Mulakan pertempuran untuk mengumpul loot.</div>';screen.innerHTML='<div class="panel"><h2>📖 Loot Codex</h2><div class="dash-stats"><div class="dash-stat"><b>'+(stats.drops||0)+'</b><span>DROP</span></div><div class="dash-stat"><b>'+(stats.legendaryDrops||0)+'</b><span>LEGENDARY</span></div><div class="dash-stat"><b>'+(stats.mythicDrops||0)+'</b><span>MYTHIC</span></div></div><h2>Rarity Diperoleh</h2>'+rarityRows+'<h2>Koleksi Item</h2>'+list+'<div class="small">Relik boss eksklusif mempunyai peluang tambahan untuk jatuh daripada boss.</div></div><div class="panel"><button class="primary" onclick="bukaInventori()">⬅️ Kembali ke Inventori</button></div>'}
function equipInventori(i){const item=S.inventory[i];if(!item)return;const slot=item.type||(Number.isFinite(item.atk)?'weapon':'armor'),current=S.gear[slot];if(current){S.inventory[i]={...current,type:slot}}else{S.inventory.splice(i,1)}S.gear[slot]={...item,type:slot};save();bukaInventori()}

function bukaMisi(){const html=QUESTS.map(q=>{const done=S.completedQuests.includes(q.id),progress=Math.min(q.target,S.questStats[q.stat]||0);return `<div class="petcard"><div class="row"><b>${q.name}</b><span class="tag">${done?'SELESAI':progress+'/'+q.target}</span></div><div class="small">${q.desc}</div><div class="small">Ganjaran: ${q.gold} emas · ${q.xp} XP</div><button style="width:100%;margin-top:8px" ${done||progress<q.target?'disabled':''} onclick="tuntutMisi('${q.id}')">${done?'✔ Ganjaran dituntut':progress<q.target?'Teruskan misi':'🎁 Tuntut ganjaran'}</button></div>`}).join('');screen.innerHTML=`<div class="panel"><h2>📜 Papan Misi</h2><p class="small">Selesaikan tugasan sambil meneruskan pengembaraan. Setiap ganjaran hanya boleh dituntut sekali.</p>${html}</div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}

function bukaKelengkapan(){const weapon=S.gear.weapon,armor=S.gear.armor;const items=[...GEAR.weapons.map(x=>({...x,type:'weapon'})),...GEAR.armors.map(x=>({...x,type:'armor'}))];screen.innerHTML=`<div class="panel"><h2>⚔️ Kelengkapan Dipakai</h2><div class="row"><span>Senjata</span><span>${weapon?weapon.name+' (+'+weapon.atk+' ATK)':'Tiada'}</span></div><div class="row"><span>Perisai</span><span>${armor?armor.name+' (+'+armor.def+' DEF)':'Tiada'}</span></div><div class="row"><span>Jumlah Attack</span><span>${playerAtkValue()}</span></div><div class="row"><span>Jumlah Defense</span><span>${S.def+(armor?armor.def:0)}</span></div></div><div class="panel"><h2>Kedai Kelengkapan</h2><div class="btns">${items.map(x=>{const equipped=x.type==='weapon'?weapon:armor;const stat=x.type==='weapon'?'+'+x.atk+' ATK':'+'+x.def+' DEF';return `<button ${equipped&&equipped.id===x.id?'disabled':''} ${S.gold<x.cost?'disabled':''} onclick="beliKelengkapan('${x.type}','${x.id}')">${x.name}<br><span class="small">${stat} · ${x.cost} 💰</span></button>`}).join('')}</div></div><div class="panel"><button class="primary" onclick="kembali()">⬅️ Kembali</button></div>`}

function readCharacterSlots(){try{const v=JSON.parse(localStorage.getItem(SLOTS_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch(e){return {}}}
function migrateCharacterSlots(){let slots=readCharacterSlots();if(Object.keys(slots).length)return slots;for(const k of [SAVE_KEY,BACKUP_KEY,TEMP_KEY]){try{const raw=localStorage.getItem(k);if(!raw)continue;const d=normalizeSave(JSON.parse(raw));const role=CLASSES[d.class]?d.class:'warrior';slots[role]=JSON.stringify(d);localStorage.setItem(SLOTS_KEY,JSON.stringify(slots));return slots}catch(e){}}return slots}
function save(){if(!S)return;try{const payload=JSON.stringify({...S,saveSchemaVersion:SAVE_SCHEMA_VERSION,lastSavedAt:new Date().toISOString()});const old=localStorage.getItem(SAVE_KEY);if(old){try{JSON.parse(old);localStorage.setItem(BACKUP_KEY,old)}catch(e){}}localStorage.setItem(TEMP_KEY,payload);JSON.parse(localStorage.getItem(TEMP_KEY));localStorage.setItem(SAVE_KEY,payload);localStorage.removeItem(TEMP_KEY);if(activeRole){const slots=readCharacterSlots();slots[activeRole]=payload;localStorage.setItem(SLOTS_KEY,JSON.stringify(slots))}}catch(e){notice('⚠️ Simpanan gagal disimpan.')}}

function renderStart(){const slots=migrateCharacterSlots();const roles=[['warrior','⚔️','WARRIOR','Ketahanan dan serangan kuat'],['assassin','🗡️','ASSASSIN','Serangan pantas dan kritikal'],['mage','🔮','MAGE','Kemahiran sihir berkuasa']];screen.innerHTML='<div class="panel center"><p style="font-size:13px;line-height:1.7;color:#9aa8c7">Pilih pahlawan untuk meneruskan pengembaraan. Setiap role mempunyai simpanan tersendiri.</p></div><div class="panel"><h2>Pilih Watak</h2>'+roles.map(([id,icon,title,desc])=>{let d=null;try{d=slots[id]?JSON.parse(slots[id]):null}catch(e){}return '<div class="petcard"><div class="row"><b>'+icon+' '+title+'</b><span class="tag">'+(d?'SAVE TERSEDIA':'SLOT KOSONG')+'</span></div><div class="small">'+desc+(d?' · '+(d.name||'Pahlawan')+' · Tahap '+(d.level||1)+' · Bab '+(d.chapter||1):'')+'</div><div class="btns">'+(d?'<button class="gold" onclick="continueRole(\''+id+'\')">▶ Sambung</button>':'<button disabled>Belum bermula</button>')+'<button onclick="newRole(\''+id+'\')">＋ '+(d?'Watak baharu':'Mulakan')+'</button></div></div>'}).join('')+'</div>'}

function continueRole(role){const d=loadSave(role);if(!d)return;activeRole=role;S=d;save();render()}
function startNew(){newRole(document.getElementById('classInput')?.value||'warrior')}

function ensureStory(){if(!S.story||typeof S.story!=='object')S.story={completed:[],choices:{},alignment:0,ending:null};if(!Array.isArray(S.story.completed))S.story.completed=[];if(!S.story.choices||typeof S.story.choices!=='object')S.story.choices={};if(!Number.isFinite(S.story.alignment))S.story.alignment=0;return S.story}
function storyEscape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bukaCerita(){if(!S)return;const st=ensureStory(),available=STORY_ARCS.filter(a=>S.chapter>=a.chapter),done=available.filter(a=>st.completed.includes(a.id));const cards=available.map(a=>{const complete=st.completed.includes(a.id),choice=st.choices[a.id];return '<div class="petcard"><div class="row"><b>Bab '+a.chapter+' · '+storyEscape(a.title)+'</b><span class="tag">'+(complete?'SELESAI':'TERSEDIA')+'</span></div><div class="small">📍 '+storyEscape(a.place)+' · '+storyEscape(a.npc)+'</div><button style="width:100%;margin-top:8px" '+(complete?'disabled':'onclick="bukaAdeganCerita(\''+a.id+'\')"')+'>'+(complete?'✔ Pilihan: '+(choice==='a'?'Kasihani':'Kekuasaan'):'📜 Baca bab cerita')+'</button></div>'}).join('');screen.innerHTML='<div class="panel"><h2>📜 Kronik Kegelapan</h2><p class="small">Lima bab utama. Pilihan anda direkodkan dalam save watak ini dan tidak boleh diundur.</p><div class="dash-stats"><div class="dash-stat"><b>'+done.length+'/5</b><span>BAB SELESAI</span></div><div class="dash-stat"><b>'+st.alignment+'</b><span>JEJAK MORAL</span></div><div class="dash-stat"><b>'+(st.ending?'1':'0')+'</b><span>PENGAKHIRAN</span></div></div>'+cards+'</div><div class="panel"><button class="primary" onclick="renderHub()">⬅️ Kembali</button></div>';save()}
function bukaAdeganCerita(id){const a=STORY_ARCS.find(x=>x.id===id);if(!a||S.chapter<a.chapter||ensureStory().completed.includes(id))return;screen.innerHTML='<div class="panel"><div class="small">KRONIK · BAB '+a.chapter+' · '+storyEscape(a.place)+'</div><h2>'+storyEscape(a.title)+'</h2><div class="enemycard"><b>☠ '+storyEscape(a.npc)+'</b></div><p style="font-size:13px;line-height:1.8">'+storyEscape(a.intro)+'</p><div class="btns"><button class="gold" onclick="pilihCerita(\''+id+'\',\'a\')">✦ '+storyEscape(a.choiceA)+'</button><button onclick="pilihCerita(\''+id+'\',\'b\')">☠ '+storyEscape(a.choiceB)+'</button></div></div><div class="panel"><button class="primary" onclick="bukaCerita()">⬅️ Kembali ke Kronik</button></div>'}
function pilihCerita(id,choice){const a=STORY_ARCS.find(x=>x.id===id),st=ensureStory();if(!a||!['a','b'].includes(choice)||S.chapter<a.chapter||st.completed.includes(id))return;st.choices[id]=choice;st.completed.push(id);st.alignment+=choice==='a'?1:-1;const reward=choice==='a'?a.rewardA:a.rewardB;S.gold+=reward.gold;gainXp(reward.xp);if(id==='throne')st.ending=choice==='a'?'Penjaga Fajar':'Raja Kegelapan';notice('📜 Bab selesai: '+a.title+'. '+(choice==='a'?a.a:a.b)+' Ganjaran: '+reward.gold+' emas · '+reward.xp+' XP.');save();bukaCerita()}


/* WORLD MAP & EXPLORATION — uses existing chapter unlock progression */
const WORLD_REGIONS=[
{chapter:1,name:'Hutan Sempadan',subtitle:'Rimba berkabus',icon:'🌲',lore:'Akar hitam menelan jalan lama. Bisikan pengawal yang hilang masih kedengaran di celah pokok.',boss:'Penjaga Rimba Terkutuk',enemy:{hp:115,atk:23,def:7,xp:110,gold:85}},
{chapter:2,name:'Dataran Orc',subtitle:'Tanah perang',icon:'🪓',lore:'Panji-panji perang reput di atas dataran yang dipenuhi senjata dan tulang.',boss:'Panglima Perang Ghorak',enemy:{hp:185,atk:34,def:12,xp:175,gold:130}},
{chapter:3,name:'Runtuhan Purba',subtitle:'Kota yang dilupakan',icon:'🏚️',lore:'Menara runtuh menyimpan rahsia sihir yang pernah menghapuskan sebuah kerajaan.',boss:'Necromancer Agung',enemy:{hp:245,atk:43,def:15,xp:245,gold:180}},
{chapter:4,name:'Pintu Gerbang Neraka',subtitle:'Benteng bara',icon:'🔥',lore:'Rantai gergasi mengikat gerbang yang berdenyut seperti jantung makhluk hidup.',boss:'Warden Gerbang',enemy:{hp:330,atk:54,def:19,xp:330,gold:240}},
{chapter:5,name:'Takhta Iblis',subtitle:'Istana sang penguasa',icon:'👑',lore:'Takhta hitam menanti sesiapa yang cukup berani untuk mencabar rajanya.',boss:'Raja Iblis',enemy:{hp:520,atk:68,def:24,xp:520,gold:390}},
{chapter:6,name:'Makam Larangan',subtitle:'Kota orang mati',icon:'⚰️',lore:'Di bawah batu nisan purba, roh kesatria masih menjaga sumpah terakhir mereka.',boss:'Raja Makam',enemy:{hp:650,atk:78,def:28,xp:650,gold:480}},
{chapter:7,name:'Jurang Abyss',subtitle:'Lautan kegelapan',icon:'🌑',lore:'Cahaya hilang di sini. Sesuatu yang jauh lebih tua daripada iblis sedang terjaga.',boss:'Hydra Abyss',enemy:{hp:820,atk:92,def:34,xp:820,gold:620}},
{chapter:8,name:'Takhta Kebinasaan',subtitle:'Penghujung dunia',icon:'☠️',lore:'Langit terbelah di atas takhta terakhir. Tiada jalan pulang selepas pertempuran ini.',boss:'Dewa Kemusnahan',enemy:{hp:1100,atk:112,def:42,xp:1150,gold:900}}
];
function ensureWorld(){if(!Number.isFinite(S.region))S.region=Math.max(1,Math.min(8,Number(S.chapter)||1));S.region=Math.max(1,Math.min(Math.max(1,Number(S.chapter)||1),S.region));if(!S.exploration||typeof S.exploration!=='object')S.exploration={visited:[],bosses:[]};if(!Array.isArray(S.exploration.visited))S.exploration.visited=[];if(!Array.isArray(S.exploration.bosses))S.exploration.bosses=[];return S.exploration}
function bukaPeta(){if(!S)return;const ex=ensureWorld();const cards=WORLD_REGIONS.map(r=>{const unlocked=r.chapter<=S.chapter,current=r.chapter===S.region,visited=ex.visited.includes(r.chapter);return '<div class="petcard" style="'+(unlocked?'':'opacity:.48')+'"><div class="row"><b>'+r.icon+' '+r.name+'</b><span class="tag">'+(current?'SEDANG DITEROKA':unlocked?(visited?'DIKUNJUNGI':'TERBUKA'):'TERKUNCI')+'</span></div><div class="small">'+r.subtitle+' · Bab '+r.chapter+'</div><p class="small" style="line-height:1.6">'+r.lore+'</p><div class="row"><span>☠ Boss wilayah</span><b>'+r.boss+'</b></div><button style="width:100%;margin-top:7px" '+(!unlocked||current?'disabled':'onclick="jelajahWilayah('+r.chapter+')"')+'>'+(current?'📍 Lokasi semasa':unlocked?'🧭 Pergi ke wilayah':'🔒 Perlu capai Bab '+r.chapter)+'</button></div>'}).join('');screen.innerHTML='<div class="panel"><h2>🗺️ Peta Dunia</h2><p class="small">Teroka lapan wilayah. Wilayah baharu terbuka mengikut kemajuan cerita dan kemenangan anda.</p><div class="dash-stats"><div class="dash-stat"><b>'+S.region+'/8</b><span>LOKASI SEMASA</span></div><div class="dash-stat"><b>'+ex.visited.length+'/8</b><span>WILAYAH DITEROKA</span></div><div class="dash-stat"><b>'+S.chapter+'/8</b><span>PROGRES TERBUKA</span></div></div>'+cards+'</div><div class="panel"><button class="primary" onclick="renderHub()">⬅️ Kembali ke Kem</button></div>';save()}
function jelajahWilayah(ch){const r=WORLD_REGIONS.find(x=>x.chapter===ch);if(!r||ch>S.chapter)return;const ex=ensureWorld();S.region=ch;if(!ex.visited.includes(ch)){ex.visited.push(ch);S.gold+=25;S.hp=Math.min(S.maxHp,S.hp+Math.round(S.maxHp*.15));notice('🧭 Tiba di '+r.name+'. Ganjaran penerokaan pertama: 25 emas dan pemulihan HP.')}else notice('🧭 Anda kembali ke '+r.name+'.');save();renderHub()}
function cabarBossWilayah(){if(!S||S.inBattle)return;const region=WORLD_REGIONS.find(x=>x.chapter===S.region);const ex=ensureWorld();if(!region)return;if(ex.bosses.includes(region.chapter)){notice('🏆 Boss wilayah ini telah ditewaskan.');renderHub();return}const b=region.enemy,ratio=Math.max(.65,Math.min(1.5,(S.level||1)/Math.max(1,Math.ceil(region.chapter*2))));S.enemy={name:'👑 '+region.boss+' [BOS WILAYAH]',level:S.level,maxHp:Math.round(b.hp*ratio),hp:Math.round(b.hp*ratio),atk:Math.round(b.atk*ratio),def:Math.round(b.def*ratio),xp:b.xp,gold:b.gold,boss:true,worldBoss:true,phase:1,guard:0};S.inBattle=true;S.defending=false;S.usedKemahirans=[];S.skillCooldowns={};S.playerStatus=[];S.enemyStatus=[];S.dodgeNext=false;S.counterNext=false;S.log=[];S.notice='';pushLog('☠️ Boss wilayah muncul di '+region.name+'!');save();render()}

if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}
render();
</script>
